[workspace]
members = ["mux-compiler"]
default-members = ["mux-compiler"]
# CI checks out muxlang/mux-runtime into ./mux-runtime so the compiler can build
# it from source (see .github/workflows/build.yml). Exclude it so Cargo does not
# try to attach that standalone crate to this workspace. Harmless when the
# directory is absent (local sibling checkouts, normal builds).
exclude = ["mux-runtime"]
resolver = "2"

# Resolve mux-runtime from the muxlang/mux-runtime `main` source rather than the
# crates.io release, so a coupled change that adds a new runtime FFI symbol builds
# (and reviews) against the source that defines it - before that runtime version
# is published. CI still builds the linked runtime library from its own checkout
# via MUX_RUNTIME_SRC; this only steers Cargo's dependency resolution. A git patch
# (not a path patch) so it also resolves where the sibling is not checked out
# (Greptile, fresh clones).
[patch.crates-io]
mux-runtime = { git = "https://github.com/muxlang/mux-runtime", branch = "main" }

[profile.release]
strip = true
lto = "thin"
codegen-units = 1
