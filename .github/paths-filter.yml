# Shared by Build and Installer Scripts. Keep the broad scripts/ and workflow
# entries: every job in the source gate exercises one of those surfaces, and a
# workflow-only change must still run the workflow being changed.
rust:
  - 'mux-compiler/**'
  - 'mux-runtime/**'
  - 'Cargo.toml'
  - 'Cargo.lock'
  - 'clippy.toml'
  - 'scripts/**'
  - 'test_scripts/**'
  - 'infra/**'
  # Local composite actions are part of the build/install contract. A change
  # here must run the jobs that consume the action, even when no Rust source
  # changed alongside it.
  - '.github/actions/**'
  - '.github/workflows/**'
  - '.github/paths-filter.yml'
