name: Build
on:
  push:
    branches:
      - main
  pull_request:
    types: [opened, synchronize, reopened]

concurrency:
  # Supersede an in-flight run for the SAME PR. Push runs deliberately get a
  # unique group (run_id): a shared group keeps only one pending run, so rapid
  # pushes to main would evict an intermediate commit's queued run before it
  # ever ran, leaving that commit unverified.
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.run_id }}
  cancel-in-progress: true

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  detect-changes:
    name: Detect Changed Paths
    runs-on: ubuntu-latest
    permissions:
      contents: read
    outputs:
      rust: ${{ steps.filter.outputs.rust }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: dorny/paths-filter@d1c1ffe0248fe513906c8e24db8ea791d46f8590
        id: filter
        with:
          filters: |
            rust:
              - 'mux-compiler/**'
              - 'mux-runtime/**'
              - 'Cargo.toml'
              - 'Cargo.lock'
              - 'clippy.toml'
              # All of scripts/, not an enumeration: the installers, leak-check
              # and the integration helpers are all exercised by jobs here, and
              # a list drifts out of date as jobs are added.
              - 'scripts/**'
              - 'test_scripts/**'
              - 'infra/**'
              # A workflow-only change would otherwise skip every job here,
              # including the one being changed.
              - '.github/workflows/**'

  format:
    # Formatting only. Clippy deliberately stays with rust_checks: it compiles
    # the crate, so it needs the LLVM install and the build cache and could
    # never be a fast gate. rustfmt needs neither, so this reports a formatting
    # slip in well under a minute instead of ~3 minutes behind an apt install.
    #
    # Not wired into the other jobs via `needs`. That would serialise this in
    # front of every run to save compute on a rare failure - and the pre-commit
    # hook already catches formatting locally, so the CI failures this catches
    # are mostly fork contributors who do not have the hook.
    name: Format
    needs: detect-changes
    if: ${{ needs.detect-changes.outputs.rust == 'true' || github.event_name == 'push' }}
    runs-on: ubuntu-latest
    permissions:
      contents: read
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@efa25f7f19611383d5b0ccf2d1c8914531636bf9
        with:
          toolchain: 1.93.1
          components: rustfmt
      - name: Formatting check
        run: cargo fmt -- --check

  rust_checks:
    name: Rust Checks
    needs: detect-changes
    if: ${{ needs.detect-changes.outputs.rust == 'true' || github.event_name == 'push' }}
    runs-on: ubuntu-latest
    permissions:
      contents: read
    env:
      LLVM_SYS_221_PREFIX: /usr/lib/llvm-22
      LLVM_CONFIG_PATH: /usr/bin/llvm-config-22
      LLVM_SYS_221_STRICT_VERSIONING: "1"
      CC: clang-22
      CXX: clang++-22
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      # No mux-runtime checkout: cargo builds it from the commit Cargo.lock
      # pins, into target/, which is the library every program here links. That
      # is what a release ships, so testing anything else would test a
      # configuration that never ships. FFI breaks against runtime `main` are
      # caught by mux-runtime's own CI, which builds this repo's `main` against
      # its source.
      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@efa25f7f19611383d5b0ccf2d1c8914531636bf9
        with:
          toolchain: 1.93.1
          components: rustfmt, clippy, llvm-tools-preview
      - name: Install LLVM 22
        run: ./scripts/ci/install-llvm.sh
      - name: Cache Cargo registry and build
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            ~/.cargo/bin
          key: ${{ runner.os }}-cargo-${{ hashFiles('**/Cargo.lock', '**/Cargo.toml') }}
          restore-keys: |
            ${{ runner.os }}-cargo-
      - name: Rust checks
        run: ./scripts/run-checks.sh
      - name: Install cargo-insta
        # Pinned, and matched to the insta library version in mux-compiler's
        # Cargo.lock. This step gates correctness rather than reporting, so it
        # must not float: `--locked` pins cargo-insta's dependencies, not
        # cargo-insta itself, and a release that changed what
        # `--unreferenced=reject` means could stop enforcing without failing.
        # Comparing the version rather than `command -v` so a cached ~/.cargo/bin
        # from an earlier run cannot silently win over the pin.
        env:
          CARGO_INSTA_VERSION: 1.47.2
        run: |
          set -euo pipefail
          if ! cargo insta --version 2>/dev/null | grep -qx "cargo-insta $CARGO_INSTA_VERSION"; then
            cargo install cargo-insta --version "$CARGO_INSTA_VERSION" --locked --force
          fi
      - name: Reject orphaned snapshots
        # test_scripts/ is auto-discovered, so deleting a script leaves its
        # snapshot behind, referenced by nothing and asserting nothing. Those
        # orphans read as coverage that does not exist - see #269. Runs here to
        # reuse the uninstrumented build from the step above.
        run: cargo insta test -p mux-lang --unreferenced=reject
      - name: Install cargo-llvm-cov
        run: command -v cargo-llvm-cov || cargo install cargo-llvm-cov --locked
      - name: Coverage
        # Re-runs the test suite under instrumentation. Integration tests shell
        # out to CARGO_BIN_EXE_mux, which llvm-cov instruments too, so codegen
        # executed in the spawned compiler is captured.
        run: cargo llvm-cov -p mux-lang --all-features --lcov --output-path lcov.info
      - name: Upload coverage report
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: coverage-lcov
          path: lcov.info
          if-no-files-found: error
  installer_scripts:
    # Nothing else runs the installers, so a syntax error in either one ships
    # silently and only surfaces when a user pipes it into their shell. Parsing
    # is cheap and catches that class of break; PSScriptAnalyzer adds the
    # PowerShell-specific ones.
    name: Installer Scripts
    needs: detect-changes
    if: ${{ needs.detect-changes.outputs.rust == 'true' || github.event_name == 'push' }}
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Parse and analyze install.ps1
        shell: pwsh
        run: |
          $errors = $null
          [System.Management.Automation.Language.Parser]::ParseFile(
            (Resolve-Path scripts/install.ps1), [ref]$null, [ref]$errors) | Out-Null
          if ($errors) {
            $errors | ForEach-Object { Write-Host $_ }
            throw "install.ps1 failed to parse"
          }

          # Import explicitly and stop on failure. Without this a module that
          # cannot load leaves $findings null, and the step passes green having
          # analyzed nothing.
          # Pinned: newer PSScriptAnalyzer requires pwsh 7.4.6+, which not every
          # runner image has. 1.22.0 loads on 7.4.2 and on current pwsh alike.
          Install-Module PSScriptAnalyzer -RequiredVersion 1.22.0 -Force -Scope CurrentUser -SkipPublisherCheck
          Import-Module PSScriptAnalyzer -ErrorAction Stop
          $findings = Invoke-ScriptAnalyzer -Path scripts/install.ps1 -Severity Error -ErrorAction Stop
          if ($findings) {
            $findings | Format-Table -AutoSize | Out-String | Write-Host
            throw "PSScriptAnalyzer reported errors"
          }
          Write-Host "install.ps1 parses cleanly and is analyzer clean"

      - name: Check install.sh
        run: |
          set -euo pipefail
          bash -n scripts/install.sh
          # Info level only reports SC2016 on the awk program, where the single
          # quotes are deliberate; warnings and above are real.
          shellcheck --severity=warning scripts/install.sh
          echo "install.sh parses cleanly and is shellcheck clean"

  packaged_artifact:
    # Reproduces a binary install: the compiler plus the bundled runtime library
    # in bin/ and lib/, and nothing else. No other job runs the compiler from
    # that layout, which is how a release that could not compile hello world
    # reached users.
    #
    # This is also the ONLY place a compiled Mux program is executed on macOS.
    # Everything else in CI is Linux, so the platform-specific work in #318 was
    # shipped unexercised there.
    #
    # GitHub-hosted on purpose: public repos get macOS unmetered here, and a
    # macOS minute is ~20x on metered runners.
    name: Packaged Artifact (${{ matrix.label }})
    needs: detect-changes
    if: ${{ needs.detect-changes.outputs.rust == 'true' || github.event_name == 'push' }}
    runs-on: ${{ matrix.os }}
    permissions:
      contents: read
    timeout-minutes: 45
    strategy:
      # One platform failing must not hide the others - telling "broken on
      # macOS" apart from "broken everywhere" is the entire point of a matrix.
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            label: linux-x86_64
          - os: macos-14
            label: macos-aarch64
          - os: windows-latest
            label: windows-x86_64
    # Every step runs under bash, including on Windows, so the build and the
    # smoke script are one code path rather than three.
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@efa25f7f19611383d5b0ccf2d1c8914531636bf9
        with:
          toolchain: 1.93.1
      - name: Setup LLVM 22
        uses: ./.github/actions/setup-llvm
        with:
          extra-components: lld
      - name: Build compiler and runtime
        # No explicit --target: the host triple is the shipped one on all three
        # runners, so output lands in target/<profile>/ and the smoke script
        # needs no per-platform path knowledge.
        run: |
          cargo build -p mux-runtime --locked
          cargo build -p mux-lang --locked
      - name: Stage and smoke-test the packaged layout
        run: ./scripts/ci/smoke-packaged.sh debug

  packaged_artifact_result:
    # Aggregates the matrix under the single stable name that the branch ruleset
    # requires. Without this, matrixing renames the check to
    # "Packaged Artifact (linux-x86_64)" and the required context
    # "Packaged Artifact Smoke Test" would never report again, wedging every PR.
    #
    # `always()` plus an explicit result test is load-bearing: a job whose
    # dependency failed is SKIPPED, and GitHub reports a skipped job as
    # successful to required checks. Without the test below, a macOS failure
    # would surface as a green required check.
    name: Packaged Artifact Smoke Test
    needs: packaged_artifact
    if: ${{ always() }}
    runs-on: ubuntu-latest
    permissions:
      contents: read
    timeout-minutes: 5
    steps:
      - name: Check matrix result
        env:
          RESULT: ${{ needs.packaged_artifact.result }}
        run: |
          set -euo pipefail
          echo "packaged_artifact matrix result: ${RESULT}"
          # `skipped` is a pass: the whole job is path-gated, so a docs-only PR
          # legitimately never runs it.
          case "${RESULT}" in
            success|skipped) ;;
            *)
              echo "packaged artifact smoke test did not pass (${RESULT})" >&2
              printf '::error::packaged artifact smoke test did not pass (%s)\n' "${RESULT}"
              exit 1
              ;;
          esac

  integration_checks:
    name: Integration Checks
    needs: detect-changes
    if: ${{ needs.detect-changes.outputs.rust == 'true' || github.event_name == 'push' }}
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - name: Docker info
        run: docker compose version
      - name: Service-backed checks
        run: ./scripts/integration-checks.sh
  valgrind:
    name: Valgrind Memory Checks
    needs: detect-changes
    if: ${{ needs.detect-changes.outputs.rust == 'true' || github.event_name == 'push' }}
    runs-on: ubuntu-latest
    permissions:
      contents: read
    # PR-blocking: Leg A (compiled programs) fails the job on any definite or
    # indirect leak / memory error. Leg B (compiler under Valgrind) is
    # report-only inside the script and never changes the exit code.
    env:
      LLVM_SYS_221_PREFIX: /usr/lib/llvm-22
      LLVM_CONFIG_PATH: /usr/bin/llvm-config-22
      LLVM_SYS_221_STRICT_VERSIONING: "1"
      CC: clang-22
      CXX: clang++-22
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      # Programs link the runtime cargo builds into target/ from the commit
      # Cargo.lock pins - the same library a release ships.
      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@efa25f7f19611383d5b0ccf2d1c8914531636bf9
        with:
          toolchain: 1.93.1
          components: llvm-tools-preview
      - name: Install LLVM 22
        run: ./scripts/ci/install-llvm.sh
      - name: Install Valgrind
        run: sudo apt-get install -y valgrind
      - name: Cache Cargo registry and build
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            ~/.cargo/bin
          key: ${{ runner.os }}-cargo-${{ hashFiles('**/Cargo.lock', '**/Cargo.toml') }}
          restore-keys: |
            ${{ runner.os }}-cargo-
      - name: Valgrind checks
        id: run
        run: |
          set -o pipefail
          ./scripts/valgrind-checks.sh 2>&1 | tee valgrind.log
      - name: Upload valgrind log for PR comment
        # Raw log only; the trusted pr-comment workflow escapes and renders it.
        if: ${{ always() && github.event_name == 'pull_request' }}
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: pr-comment-valgrind
          path: valgrind.log
          if-no-files-found: warn
  rc_leak_check:
    name: RC Leak Check
    needs: detect-changes
    if: ${{ needs.detect-changes.outputs.rust == 'true' || github.event_name == 'push' }}
    runs-on: ubuntu-latest
    permissions:
      contents: read
    # PR-blocking: runs the executable-integration suite against a mux-runtime
    # built with the `rc-leak-check` feature, which asserts at process exit that
    # every reference-counted Value block was released (see mux-runtime
    # src/refcount.rs). This is exact, unlike the Valgrind leg: it catches
    # "still reachable" leaks - a module global or enum payload left at refcount
    # 1 (mux-compiler#284) - that Valgrind's definite/indirect policy ignores. A
    # leaking program exits 101 with a diagnostic, so its snapshot no longer
    # matches and the suite fails.
    env:
      LLVM_SYS_221_PREFIX: /usr/lib/llvm-22
      LLVM_CONFIG_PATH: /usr/bin/llvm-config-22
      LLVM_SYS_221_STRICT_VERSIONING: "1"
      CC: clang-22
      CXX: clang++-22
      MUX_RUNTIME_SRC: ${{ github.workspace }}/mux-runtime
      # Built explicitly below and forced via MUX_RUNTIME_LIB, mirroring
      # scripts/leak-check.sh. `rc-leak-check` is deliberately outside `full`,
      # so it is the one runtime the compiler cannot produce on its own.
      MUX_RUNTIME_LEAK_FEATURES: core,json,csv,net,sql,sync,rc-leak-check
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          repository: muxlang/mux-runtime
          ref: main
          path: mux-runtime
      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@efa25f7f19611383d5b0ccf2d1c8914531636bf9
        with:
          toolchain: 1.93.1
          components: llvm-tools-preview
      - name: Install LLVM 22
        run: ./scripts/ci/install-llvm.sh
      - name: Cache Cargo registry and build
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            ~/.cargo/bin
          key: ${{ runner.os }}-cargo-${{ hashFiles('**/Cargo.lock', '**/Cargo.toml') }}
          restore-keys: |
            ${{ runner.os }}-cargo-
      - name: Build the rc-leak-check runtime
        run: |
          set -euo pipefail
          cd "$MUX_RUNTIME_SRC"
          # --locked: this is a clean checkout of mux-runtime with its committed
          # lock, so resolving fresh here would build something the repo never
          # pinned (flagged by sonar githubactions:S8549).
          cargo build --locked --no-default-features \
            --features "$MUX_RUNTIME_LEAK_FEATURES" \
            --target-dir "$MUX_RUNTIME_SRC/target"
          test -f "$MUX_RUNTIME_SRC/target/debug/libmux_runtime.a"

      - name: Executable suite under leak-check runtime
        # MUX_RUNTIME_LIB forces the archive built above, so every program links
        # the leak-check runtime and runs the exit-time assertion. A leaked block
        # exits 101 with a diagnostic, so its snapshot no longer matches and the
        # suite fails.
        env:
          MUX_RUNTIME_LIB: ${{ github.workspace }}/mux-runtime/target/debug/libmux_runtime.a
        run: cargo test -p mux-lang --test executable_integration
  sonarqube:
    name: SonarQube
    # Runs on every push and pull request (no path gating): SonarQube analyzes
    # the whole project, so it must not be skipped just because no Rust files
    # changed. `needs` + `always()` lets it still run when rust_checks is
    # path-skipped; the coverage download is best-effort in that case.
    needs: rust_checks
    if: ${{ always() }}
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 0
      - name: Download coverage report
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        continue-on-error: true
        with:
          name: coverage-lcov
      - name: SonarQube Scan
        uses: SonarSource/sonarqube-scan-action@a31c9398be7ace6bbfaf30c0bd5d415f843d45e9
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
      # The scan above waits for analysis (sonar.qualitygate.wait), so the
      # new-issue count is queryable by the time this runs.
      - name: Fail on new SonarCloud issues
        if: github.event_name == 'pull_request'
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
        run: ./scripts/ci/sonar-new-issues.sh muxlang_mux-compiler "${{ github.event.pull_request.number }}"
