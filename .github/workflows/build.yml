name: Build
on:
  push:
    branches:
      - main
  pull_request:
    types: [opened, synchronize, reopened]

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  detect-changes:
    name: Detect Changed Paths
    runs-on: ubuntu-latest
    outputs:
      rust: ${{ steps.filter.outputs.rust }}
    steps:
      - uses: actions/checkout@v4
      - uses: dorny/paths-filter@d1c1ffe0248fe513906c8e24db8ea791d46f8590
        id: filter
        with:
          filters: |
            rust:
              - 'mux-compiler/**'
              - 'mux-runtime/**'
              - 'Cargo.toml'
              - 'Cargo.lock'
              - 'clippy.toml'
              - 'scripts/run-checks.sh'
              - 'scripts/dev-cargo.sh'
              - 'scripts/valgrind-checks.sh'
              - 'scripts/bench-report.py'
              - 'test_scripts/**'
              - 'infra/**'

  rust_checks:
    name: Rust Checks
    needs: detect-changes
    if: ${{ needs.detect-changes.outputs.rust == 'true' || github.event_name == 'push' }}
    runs-on: ubuntu-latest
    env:
      LLVM_SYS_221_PREFIX: /usr/lib/llvm-22
      LLVM_CONFIG_PATH: /usr/bin/llvm-config-22
      LLVM_SYS_221_STRICT_VERSIONING: "1"
      CC: clang-22
      CXX: clang++-22
      MUX_RUNTIME_SRC: ${{ github.workspace }}/mux-runtime
    steps:
      - uses: actions/checkout@v4
      - uses: actions/checkout@v4
        with:
          repository: muxlang/mux-runtime
          ref: main
          path: mux-runtime
      - id: runtime_sha
        run: echo "sha=$(git -C mux-runtime rev-parse HEAD)" >> "$GITHUB_OUTPUT"
      - uses: actions/cache@v4
        with:
          path: ~/.cache/mux-lang/runtime
          key: ${{ runner.os }}-muxrt-1.93.1-${{ steps.runtime_sha.outputs.sha }}
      # The compiler's build.rs reuses any libmux_runtime already present in the
      # cache dir without checking whether the runtime source changed, so a
      # restored-but-stale library can be linked into test programs and mismatch
      # the current runtime ABI. Remove it AFTER the cache restore so the build
      # rebuilds the runtime from the checked-out source.
      - name: Clear restored runtime library
        run: rm -rf ~/.cache/mux-lang/runtime
      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@efa25f7f19611383d5b0ccf2d1c8914531636bf9
        with:
          toolchain: 1.93.1
          components: rustfmt, clippy, llvm-tools-preview
      - name: Install LLVM 22
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends ca-certificates gnupg lsb-release wget
          sudo wget --max-redirect=0 -O /usr/share/keyrings/llvm-snapshot.gpg.key https://apt.llvm.org/llvm-snapshot.gpg.key
          echo "deb [signed-by=/usr/share/keyrings/llvm-snapshot.gpg.key] https://apt.llvm.org/$(lsb_release -cs)/ llvm-toolchain-$(lsb_release -cs)-22 main" | sudo tee /etc/apt/sources.list.d/llvm.list
          sudo apt-get update
          sudo apt-get install -y llvm-22-dev clang-22 libpolly-22-dev
      - name: Cache Cargo registry and build
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            ~/.cargo/bin
          key: ${{ runner.os }}-cargo-${{ hashFiles('**/Cargo.lock', '**/Cargo.toml') }}
          restore-keys: |
            ${{ runner.os }}-cargo-
      - name: Formatting check
        run: cargo fmt -- --check
      - name: Rust checks
        run: ./scripts/run-checks.sh
      - name: Install cargo-llvm-cov
        run: command -v cargo-llvm-cov || cargo install cargo-llvm-cov --locked
      - name: Coverage
        # Re-runs the test suite under instrumentation. Integration tests shell
        # out to CARGO_BIN_EXE_mux, which llvm-cov instruments too, so codegen
        # executed in the spawned compiler is captured.
        run: cargo llvm-cov -p mux-lang --all-features --lcov --output-path lcov.info
      - name: Upload coverage report
        uses: actions/upload-artifact@v4
        with:
          name: coverage-lcov
          path: lcov.info
          if-no-files-found: error
  integration_checks:
    name: Integration Checks
    needs: detect-changes
    if: ${{ needs.detect-changes.outputs.rust == 'true' || github.event_name == 'push' }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      # The dev container mounts the repo at /workspace and sets
      # MUX_RUNTIME_SRC=/workspace/mux-runtime, so the compiler builds the
      # runtime from source. Check it out here (root Cargo.toml excludes it
      # from the workspace) instead of falling back to the crates.io pin.
      - uses: actions/checkout@v4
        with:
          repository: muxlang/mux-runtime
          ref: main
          path: mux-runtime
      - name: Docker info
        run: docker compose version
      - name: Service-backed checks
        run: ./scripts/integration-checks.sh
  valgrind:
    name: Valgrind Memory Checks
    needs: detect-changes
    if: ${{ needs.detect-changes.outputs.rust == 'true' || github.event_name == 'push' }}
    runs-on: ubuntu-latest
    # PR-blocking: Leg A (compiled programs) fails the job on any definite or
    # indirect leak / memory error. Leg B (compiler under Valgrind) is
    # report-only inside the script and never changes the exit code.
    env:
      LLVM_SYS_221_PREFIX: /usr/lib/llvm-22
      LLVM_CONFIG_PATH: /usr/bin/llvm-config-22
      LLVM_SYS_221_STRICT_VERSIONING: "1"
      CC: clang-22
      CXX: clang++-22
      MUX_RUNTIME_SRC: ${{ github.workspace }}/mux-runtime
    steps:
      - uses: actions/checkout@v4
      - uses: actions/checkout@v4
        with:
          repository: muxlang/mux-runtime
          ref: main
          path: mux-runtime
      - id: runtime_sha
        run: echo "sha=$(git -C mux-runtime rev-parse HEAD)" >> "$GITHUB_OUTPUT"
      - name: Clear stale runtime cache
        run: rm -rf ~/.cache/mux-lang/runtime
      - uses: actions/cache@v4
        with:
          path: ~/.cache/mux-lang/runtime
          key: ${{ runner.os }}-muxrt-1.93.1-${{ steps.runtime_sha.outputs.sha }}
      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@efa25f7f19611383d5b0ccf2d1c8914531636bf9
        with:
          toolchain: 1.93.1
          components: llvm-tools-preview
      - name: Install LLVM 22
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends ca-certificates gnupg lsb-release wget
          sudo wget --max-redirect=0 -O /usr/share/keyrings/llvm-snapshot.gpg.key https://apt.llvm.org/llvm-snapshot.gpg.key
          echo "deb [signed-by=/usr/share/keyrings/llvm-snapshot.gpg.key] https://apt.llvm.org/$(lsb_release -cs)/ llvm-toolchain-$(lsb_release -cs)-22 main" | sudo tee /etc/apt/sources.list.d/llvm.list
          sudo apt-get update
          sudo apt-get install -y llvm-22-dev clang-22 libpolly-22-dev
      - name: Install Valgrind
        run: sudo apt-get install -y valgrind
      - name: Cache Cargo registry and build
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            ~/.cargo/bin
          key: ${{ runner.os }}-cargo-${{ hashFiles('**/Cargo.lock', '**/Cargo.toml') }}
          restore-keys: |
            ${{ runner.os }}-cargo-
      - name: Valgrind checks
        id: run
        run: |
          set -o pipefail
          ./scripts/valgrind-checks.sh 2>&1 | tee valgrind.log
      - name: Upload valgrind log for PR comment
        # Raw log only; the trusted pr-comment workflow escapes and renders it.
        if: ${{ always() && github.event_name == 'pull_request' }}
        uses: actions/upload-artifact@v4
        with:
          name: pr-comment-valgrind
          path: valgrind.log
          if-no-files-found: warn
  benchmarks:
    name: Benchmarks (report-only)
    needs: detect-changes
    if: ${{ needs.detect-changes.outputs.rust == 'true' || github.event_name == 'push' }}
    runs-on: ubuntu-latest
    # Informational only: shared GitHub runners have 10-30%+ wall-clock variance,
    # so a benchmark threshold would be both flaky and insensitive. This job never
    # gates merges (continue-on-error) - it publishes the per-phase distribution as
    # an artifact. The authoritative low-noise comparison is local:
    # `cargo bench -- --save-baseline main` then `--baseline main` on one machine.
    continue-on-error: true
    env:
      LLVM_SYS_221_PREFIX: /usr/lib/llvm-22
      LLVM_CONFIG_PATH: /usr/bin/llvm-config-22
      LLVM_SYS_221_STRICT_VERSIONING: "1"
      CC: clang-22
      CXX: clang++-22
      MUX_RUNTIME_SRC: ${{ github.workspace }}/mux-runtime
    steps:
      - uses: actions/checkout@v4
      # The execution benchmarks compile+link+run real programs, so the runtime
      # is built from source (root Cargo.toml excludes it from the workspace).
      - uses: actions/checkout@v4
        with:
          repository: muxlang/mux-runtime
          ref: main
          path: mux-runtime
      - id: runtime_sha
        run: echo "sha=$(git -C mux-runtime rev-parse HEAD)" >> "$GITHUB_OUTPUT"
      - name: Clear stale runtime cache
        run: rm -rf ~/.cache/mux-lang/runtime
      - uses: actions/cache@v4
        with:
          path: ~/.cache/mux-lang/runtime
          key: ${{ runner.os }}-muxrt-1.93.1-${{ steps.runtime_sha.outputs.sha }}
      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@efa25f7f19611383d5b0ccf2d1c8914531636bf9
        with:
          toolchain: 1.93.1
          components: llvm-tools-preview
      - name: Install LLVM 22
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends ca-certificates gnupg lsb-release wget
          sudo wget --max-redirect=0 -O /usr/share/keyrings/llvm-snapshot.gpg.key https://apt.llvm.org/llvm-snapshot.gpg.key
          echo "deb [signed-by=/usr/share/keyrings/llvm-snapshot.gpg.key] https://apt.llvm.org/$(lsb_release -cs)/ llvm-toolchain-$(lsb_release -cs)-22 main" | sudo tee /etc/apt/sources.list.d/llvm.list
          sudo apt-get update
          sudo apt-get install -y llvm-22-dev clang-22 libpolly-22-dev
      - name: Cache Cargo registry and build
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            ~/.cargo/bin
          key: ${{ runner.os }}-cargo-${{ hashFiles('**/Cargo.lock', '**/Cargo.toml') }}
          restore-keys: |
            ${{ runner.os }}-cargo-
      - name: Run benchmarks
        id: run
        run: |
          set -o pipefail
          cargo bench -p mux-lang 2>&1 | tee bench.log
      - name: Build per-phase distribution report
        run: python3 scripts/bench-report.py
      - name: Upload benchmark report
        uses: actions/upload-artifact@v4
        with:
          name: benchmark-report
          path: |
            target/bench-report/
            target/criterion/
          if-no-files-found: warn
      - name: Upload benchmark log for PR comment
        # Raw log only; the trusted pr-comment workflow escapes and renders it.
        if: ${{ always() && github.event_name == 'pull_request' }}
        uses: actions/upload-artifact@v4
        with:
          name: pr-comment-benchmarks
          path: bench.log
          if-no-files-found: warn
  sonarqube:
    name: SonarQube
    # Runs on every push and pull request (no path gating): SonarQube analyzes
    # the whole project, so it must not be skipped just because no Rust files
    # changed. `needs` + `always()` lets it still run when rust_checks is
    # path-skipped; the coverage download is best-effort in that case.
    needs: rust_checks
    if: ${{ always() }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Download coverage report
        uses: actions/download-artifact@v4
        continue-on-error: true
        with:
          name: coverage-lcov
      - name: SonarQube Scan
        uses: SonarSource/sonarqube-scan-action@a31c9398be7ace6bbfaf30c0bd5d415f843d45e9
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
      # The free SonarCloud plan locks every project to the built-in "Sonar way"
      # gate, which only fails on rating/coverage thresholds and so lets new
      # issues (e.g. a single code smell) through. Enforce "zero new issues"
      # ourselves: the scan above waits for analysis (sonar.qualitygate.wait),
      # so the new-issue count is queryable here.
      - name: Fail on new SonarCloud issues
        if: github.event_name == 'pull_request'
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
        run: |
          measure=$(curl -sf -u "$SONAR_TOKEN:" \
            "https://sonarcloud.io/api/measures/component?component=muxlang_mux-compiler&pullRequest=${PR_NUMBER}&metricKeys=new_violations")
          # new_violations is a new-code metric, so the count lives under
          # period.value (or periods[].value on older responses), not value.
          count=$(printf '%s' "$measure" | jq -r '(.component.measures[0] // {}) as $m | $m.value // $m.period.value // $m.periods[0].value // "0"')
          echo "New SonarCloud issues on PR #${PR_NUMBER}: ${count}"
          if [ "${count:-0}" -gt 0 ]; then
            echo "::error::${count} new SonarCloud issue(s) introduced on this PR. See https://sonarcloud.io/project/issues?id=muxlang_mux-compiler&pullRequest=${PR_NUMBER}&resolved=false&inNewCodePeriod=true"
            exit 1
          fi
