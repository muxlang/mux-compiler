name: Build
on:
  push:
    branches:
      - main
  pull_request:
    types: [opened, synchronize, reopened]

concurrency:
  # Supersede an in-flight run for the SAME PR. Push runs deliberately get a
  # unique group (run_id): a shared group keeps only one pending run, so rapid
  # pushes to main would evict an intermediate commit's queued run before it
  # ever ran, leaving that commit unverified.
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.run_id }}
  cancel-in-progress: true

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

# Inside a `container:`, GitHub defaults `run:` steps to `sh -e {0}`, not
# bash - which turns `set -o pipefail` into "Illegal option" and killed the
# valgrind job. Set it once here rather than per step.
defaults:
  run:
    shell: bash

jobs:
  detect-changes:
    name: Detect Changed Paths
    runs-on: ubuntu-latest
    permissions:
      contents: read
    outputs:
      rust: ${{ steps.filter.outputs.rust }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: dorny/paths-filter@ceb8a2b8f2d89434be7ff52d3de7ec3738c5cc9d # v4.0.3
        id: filter
        with:
          filters: .github/paths-filter.yml

  cargo_deny:
    name: Cargo dependency policy
    needs: detect-changes
    if: ${{ needs.detect-changes.outputs.rust == 'true' || github.event_name == 'push' }}
    runs-on: ubuntu-latest
    permissions:
      contents: read
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@efa25f7f19611383d5b0ccf2d1c8914531636bf9 # untagged master commit; the repo's only tag (v1) is OLDER than this
        with:
          toolchain: 1.93.1
      - name: Install cargo-deny
        run: cargo install cargo-deny --locked --version 0.20.2
      - name: Check advisories, licenses, and sources
        run: cargo deny check advisories licenses sources bans

  format:
    # Formatting only. Clippy is its own job below: it compiles the crate, so
    # it needs the LLVM install and the build cache and could never be a fast
    # gate the way this one is. rustfmt needs neither, so this reports a
    # formatting slip in well under a minute instead of ~3 minutes behind an
    # apt install.
    #
    # Not wired into the other jobs via `needs`. That would serialise this in
    # front of every run to save compute on a rare failure - and the pre-commit
    # hook already catches formatting locally, so the CI failures this catches
    # are mostly fork contributors who do not have the hook.
    name: Format
    needs: detect-changes
    if: ${{ needs.detect-changes.outputs.rust == 'true' || github.event_name == 'push' }}
    runs-on: blacksmith-2vcpu-ubuntu-2404
    # The CI image already carries the pinned toolchain and rustfmt, so the
    # per-job toolchain install is gone. 2vCPU, not 4: these jobs stay separate
    # and parallel, so wall clock is set by the slowest one, and doubling the
    # rate to shave seconds off a job nothing waits on is wasted allowance.
    # No credentials: the package is public, so an anonymous pull works. That
    # matters for fork PRs - their GITHUB_TOKEN is scoped to the fork and cannot
    # authenticate to this org's registry, so supplying credentials would fail
    # exactly where an anonymous pull succeeds.
    container: ghcr.io/muxlang/mux-ci:main
    permissions:
      contents: read
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Formatting check
        run: cargo fmt -- --check

  ab_benchmark_gate:
    # Roc-style A/B regression gate (plan.md step 5): builds a release binary
    # for the PR head and for the PR's base commit, times a curated program
    # set with hyperfine, and fails only on a change that clears BOTH a
    # relative and an absolute threshold, confirmed by a second run, with an
    # escape hatch for programs whose compiled output is provably unchanged.
    # See scripts/ci/ab-bench-gate.py for the full algorithm.
    #
    # PR-only: it needs github.event.pull_request.base.sha, which does not
    # exist on a push event. Parallel to detect-changes (not behind
    # rust_checks/clippy) to stay close to the ~5 min PR-feedback target.
    name: A/B Benchmark Report
    needs: detect-changes
    if: ${{ github.event_name == 'pull_request' && needs.detect-changes.outputs.rust == 'true' }}
    # First job on Blacksmith, deliberately this one. It is the slowest job on
    # a PR run (3.8-6.7m measured) and therefore the repo's critical path, so
    # it is where a faster runner can actually shorten PR feedback - the Linux
    # jobs all finish well inside it and would gain nothing visible.
    #
    # It stays a job of its own and must never be folded into a bundle: it is a
    # benchmark, and sharing a machine with valgrind or a coverage build turns
    # its measurements into contention noise. Dedicated hardware may also prove
    # steadier than GitHub's shared runners, which is worth watching - the
    # sibling gate in mux-runtime needed its threshold widened from 4% to 15%
    # because of measurement noise, and that is the kind of thing better
    # hardware fixes.
    #
    # 4vCPU because the job is dominated by two --release compiler builds,
    # which parallelise; the benchmark phase itself is single-threaded and
    # indifferent to core count.
    runs-on: blacksmith-4vcpu-ubuntu-2404
    permissions:
      contents: read
    # Unchanged at 30m. Generous against a ~6m job, but the baseline cache miss
    # path rebuilds a release binary from scratch, and a false timeout on a
    # required check is worse than a slow one. Metered now, so a hang costs
    # real allowance: 30m at the 4vCPU rate is 60 x64-2vCPU-equivalent minutes.
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@efa25f7f19611383d5b0ccf2d1c8914531636bf9 # untagged master commit; the repo's only tag (v1) is OLDER than this
        with:
          toolchain: 1.93.1
      - name: Setup LLVM 22
        uses: ./.github/actions/setup-llvm
      # Separate cache scope from rust_checks/clippy/valgrind's debug-build
      # cache: this is the only job building --release, and sharing one key
      # across debug and release artifacts would make every job pay for
      # archive contents it does not use.
      # Caches the release BUILD, not just the registry. `workspaces` is needed
      # because this job builds into target-ab-pr rather than target/, and
      # rust-cache only knows about ./target by default - without it the whole
      # LLVM/inkwell tree recompiled from cold on every run.
      #
      # The baseline's target dir is deliberately not listed. With the seed job
      # below populating the baseline on main, building one here is the rare
      # path, and caching a second multi-GB release tree to speed it up would
      # cost more cache than it saves.
      - name: Cache Cargo registry and release build
        uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        with:
          workspaces: ". -> target-ab-pr"
          save-if: ${{ github.ref == 'refs/heads/main' }}
      - name: Build PR head (release)
        run: cargo build -p mux-runtime -p mux-lang --release --locked --target-dir target-ab-pr
      - name: Stage PR binary
        run: |
          mkdir -p ab-bin/pr
          cp target-ab-pr/release/mux target-ab-pr/release/libmux_runtime.a ab-bin/pr/
      # Exact-SHA cache key, deliberately no restore-keys fallback: a
      # restore-keys hit on an older base commit would silently compare the
      # PR against the wrong baseline with nothing to signal it. A cache
      # miss (the first PR after a merge to main) pays a full release
      # rebuild; every later PR on the same base restores it in seconds.
      - name: Restore or build baseline binary
        id: baseline_cache
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ab-bin/baseline
          key: mux-ab-baseline-linux-${{ github.event.pull_request.base.sha }}
      - name: Checkout baseline commit
        if: steps.baseline_cache.outputs.cache-hit != 'true'
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.pull_request.base.sha }}
          path: baseline-src
      - name: Build baseline (release)
        if: steps.baseline_cache.outputs.cache-hit != 'true'
        working-directory: baseline-src
        run: cargo build -p mux-runtime -p mux-lang --release --locked --target-dir ../target-ab-baseline
      - name: Stage baseline binary
        if: steps.baseline_cache.outputs.cache-hit != 'true'
        run: |
          mkdir -p ab-bin/baseline
          cp target-ab-baseline/release/mux target-ab-baseline/release/libmux_runtime.a ab-bin/baseline/
      - name: Install hyperfine
        env:
          HYPERFINE_VERSION: "1.20.0"
          HYPERFINE_SHA256: "63ad53934062118f5b0be11785e0bb1603d4b91667d1921f2fd8df9a8712040a"
        run: |
          set -euo pipefail
          archive="hyperfine-v${HYPERFINE_VERSION}-x86_64-unknown-linux-gnu.tar.gz"
          curl -sSfL --proto "=https" --retry 5 --retry-all-errors -o "$archive" \
            "https://github.com/sharkdp/hyperfine/releases/download/v${HYPERFINE_VERSION}/${archive}"
          echo "${HYPERFINE_SHA256}  ${archive}" | sha256sum -c -
          tar -xzf "$archive" "hyperfine-v${HYPERFINE_VERSION}-x86_64-unknown-linux-gnu/hyperfine"
          install -m 755 "hyperfine-v${HYPERFINE_VERSION}-x86_64-unknown-linux-gnu/hyperfine" /usr/local/bin/hyperfine
      - name: Run A/B benchmark report
        # continue-on-error: this reports, it does not gate. The comparison is
        # informative but not trustworthy enough to block a merge - see the
        # job comment above - so a regression verdict must reach the reviewer
        # without turning the check red. The exit code is still recorded in the
        # log, and the table names any benchmark past the threshold.
        continue-on-error: true
        run: |
          set -o pipefail
          python3 scripts/ci/ab-bench-gate.py \
            --baseline-bin-dir ab-bin/baseline --pr-bin-dir ab-bin/pr 2>&1 | tee ab-bench.log
      - name: Upload the A/B report for the PR comment
        if: ${{ always() }}
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: pr-comment-ab-bench
          path: ab-bench.log
          if-no-files-found: warn

  ab_baseline_seed:
    # Builds the A/B baseline binary for main and stores it under the key a PR
    # will look for, so the PR path normally hits and skips the baseline build.
    #
    # Before this, the exact-SHA key meant the FIRST pull request after every
    # merge paid for a full --release build of the compiler - the single most
    # expensive step in the job - and only later PRs on that base reused it.
    #
    # Push-only: it writes a cache keyed by github.sha, which on a push to main
    # is exactly the base.sha a PR opened against it asks for.
    name: Seed A/B Baseline
    # Every push to main, not just rust ones. A docs-only push still advances
    # main and so becomes some PR's base.sha; skipping it would leave that key
    # unseeded and hand the first PR based on it exactly the --release baseline
    # build this job exists to remove.
    if: ${{ github.event_name == 'push' }}
    runs-on: blacksmith-4vcpu-ubuntu-2404
    permissions:
      contents: read
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@efa25f7f19611383d5b0ccf2d1c8914531636bf9 # untagged master commit; the repo's only tag (v1) is OLDER than this
        with:
          toolchain: 1.93.1
      - name: Setup LLVM 22
        uses: ./.github/actions/setup-llvm
      - name: Restore baseline binary
        id: baseline_cache
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ab-bin/baseline
          key: mux-ab-baseline-linux-${{ github.sha }}
      - name: Cache Cargo registry and release build
        if: steps.baseline_cache.outputs.cache-hit != 'true'
        uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        with:
          workspaces: ". -> target-ab-baseline"
          save-if: ${{ github.ref == 'refs/heads/main' }}
      - name: Build baseline (release)
        if: steps.baseline_cache.outputs.cache-hit != 'true'
        run: cargo build -p mux-runtime -p mux-lang --release --locked --target-dir target-ab-baseline
      - name: Stage baseline binary
        if: steps.baseline_cache.outputs.cache-hit != 'true'
        run: |
          mkdir -p ab-bin/baseline
          cp target-ab-baseline/release/mux target-ab-baseline/release/libmux_runtime.a ab-bin/baseline/

  clippy:
    # Separated from rust_checks so a clippy failure is not buried behind
    # insta/coverage: it still needs the LLVM install and a full cargo build
    # to compile the crate, so unlike `format` it can never be as fast as a
    # rustfmt-only check - but it skips everything rust_checks does beyond
    # that. Deliberately NOT wired via `needs` into the expensive jobs
    # (integration/valgrind/rc-leak-check/packaged-artifact): the pre-commit
    # hook already catches clippy locally, and serializing every green run
    # behind this to save time only on the rare failure path is the wrong
    # trade for the common case (same reasoning `format` already documents).
    name: Clippy
    needs: detect-changes
    if: ${{ needs.detect-changes.outputs.rust == 'true' || github.event_name == 'push' }}
    runs-on: blacksmith-2vcpu-ubuntu-2404
    # No credentials: the package is public, so an anonymous pull works. That
    # matters for fork PRs - their GITHUB_TOKEN is scoped to the fork and cannot
    # authenticate to this org's registry, so supplying credentials would fail
    # exactly where an anonymous pull succeeds.
    container: ghcr.io/muxlang/mux-ci:main
    permissions:
      contents: read
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Cache Cargo registry and build artifacts
        # Was actions/cache over ~/.cargo/{registry,git,bin} only. Despite the
        # step name, target/ was never cached, so every job below did a cold
        # full compile of the LLVM/inkwell dependency tree on every run.
        #
        # Adding target/ to the old config would not have worked: all four jobs
        # shared one key, so whichever finished first saved its target/ and the
        # other three restored artifacts built under a different profile
        # (clippy runs --all-targets --all-features, coverage runs
        # instrumented). rust-cache keys per job automatically - job id plus
        # rustc version plus Cargo.lock - which is what makes a shared cache
        # correct here rather than merely large.
        #
        # save-if restricts writes to main: four jobs each saving a multi-GB
        # target/ on every PR run would churn through the 10GB repo cache limit
        # and evict the entries this exists to provide. PRs restore from main's
        # cache, which is the state they branch from anyway.
        uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        with:
          save-if: ${{ github.ref == 'refs/heads/main' }}
      - name: Build
        # mux-runtime is a dependency, and cargo builds only a dependency's
        # rlib - not the staticlib compiled Mux programs link against.
        run: cargo build -p mux-runtime -p mux-lang --locked
      - name: Clippy
        run: cargo clippy -p mux-lang --all-targets --all-features -- -D warnings

  rust_checks:
    name: Rust Checks
    needs: detect-changes
    if: ${{ needs.detect-changes.outputs.rust == 'true' || github.event_name == 'push' }}
    runs-on: blacksmith-2vcpu-ubuntu-2404
    # No credentials: the package is public, so an anonymous pull works. That
    # matters for fork PRs - their GITHUB_TOKEN is scoped to the fork and cannot
    # authenticate to this org's registry, so supplying credentials would fail
    # exactly where an anonymous pull succeeds.
    container: ghcr.io/muxlang/mux-ci:main
    permissions:
      contents: read
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      # No mux-runtime checkout: cargo builds it from the commit Cargo.lock
      # pins, into target/, which is the library every program here links. That
      # is what a release ships, so testing anything else would test a
      # configuration that never ships. FFI breaks against runtime `main` are
      # caught by mux-runtime's own CI, which builds this repo's `main` against
      # its source.
      - name: Cache Cargo registry and build artifacts
        # Was actions/cache over ~/.cargo/{registry,git,bin} only. Despite the
        # step name, target/ was never cached, so every job below did a cold
        # full compile of the LLVM/inkwell dependency tree on every run.
        #
        # Adding target/ to the old config would not have worked: all four jobs
        # shared one key, so whichever finished first saved its target/ and the
        # other three restored artifacts built under a different profile
        # (clippy runs --all-targets --all-features, coverage runs
        # instrumented). rust-cache keys per job automatically - job id plus
        # rustc version plus Cargo.lock - which is what makes a shared cache
        # correct here rather than merely large.
        #
        # save-if restricts writes to main: four jobs each saving a multi-GB
        # target/ on every PR run would churn through the 10GB repo cache limit
        # and evict the entries this exists to provide. PRs restore from main's
        # cache, which is the state they branch from anyway.
        uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        with:
          save-if: ${{ github.ref == 'refs/heads/main' }}
      - name: Rust checks
        run: ./scripts/run-checks.sh
      # cargo-insta is no longer installed here. It is baked into the CI image
      # at 1.47.2, still matched to the insta library version in Cargo.lock -
      # the pin moved, it did not go away. See infra/docker/integration/Dockerfile.
      - name: Reject orphaned snapshots
        # test_scripts/ is auto-discovered, so deleting a script leaves its
        # snapshot behind, referenced by nothing and asserting nothing. Those
        # orphans read as coverage that does not exist - see #269. Runs here to
        # reuse the uninstrumented build from the step above.
        run: cargo insta test -p mux-lang --unreferenced=reject
      # cargo-llvm-cov comes from the CI image too, pinned at 0.8.7 - it used
      # to be installed unpinned here on every run.
      - name: Install nightly toolchain for branch coverage
        uses: dtolnay/rust-toolchain@efa25f7f19611383d5b0ccf2d1c8914531636bf9 # untagged master commit; the repo's only tag (v1) is OLDER than this
        with:
          toolchain: nightly
      - name: Coverage
        # Re-runs the test suite under instrumentation. Integration tests shell
        # out to CARGO_BIN_EXE_mux, which llvm-cov instruments too, so codegen
        # executed in the spawned compiler is captured.
        run: cargo +nightly llvm-cov -p mux-lang --all-features --branch --lcov --output-path lcov.info
      - name: Upload coverage report
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: coverage-lcov
          path: lcov.info
          if-no-files-found: error
  packaged_artifact:
    # The packaged-artifact workflow owns the cross-platform installation smoke
    # test. Keep this caller in Build so the required "Packaged Artifact Smoke
    # Test" status remains part of the normal source-check workflow.
    needs: detect-changes
    uses: ./.github/workflows/packaged-artifact.yml
    with:
      rust: ${{ needs.detect-changes.outputs.rust == 'true' }}
    permissions:
      contents: read

  packaged_artifact_result:
    # Keep this aggregator in Build so the required check name is unchanged
    # when the platform matrix moves into the reusable workflow.
    name: Packaged Artifact Smoke Test
    needs: packaged_artifact
    if: ${{ always() }}
    runs-on: ubuntu-latest
    permissions:
      contents: read
    timeout-minutes: 5
    steps:
      - name: Check matrix result
        env:
          RESULT: ${{ needs.packaged_artifact.result }}
        run: |
          set -euo pipefail
          echo "packaged_artifact matrix result: ${RESULT}"
          # `skipped` is a pass: the whole job is path-gated, so a docs-only PR
          # legitimately never runs it.
          case "${RESULT}" in
            success|skipped) ;;
            *)
              echo "packaged artifact smoke test did not pass (${RESULT})" >&2
              printf '::error::packaged artifact smoke test did not pass (%s)\n' "${RESULT}"
              exit 1
              ;;
          esac

  integration_checks:
    name: Integration Checks
    needs: detect-changes
    if: ${{ needs.detect-changes.outputs.rust == 'true' || github.event_name == 'push' }}
    runs-on: blacksmith-4vcpu-ubuntu-2404
    # Not containerised: this job drives `docker compose`, so it needs a daemon
    # rather than to be inside one. Blacksmith runners are VMs with Docker, the
    # same as ubuntu-latest - only the in-container jobs had that constraint.
    #
    # 4vCPU, unlike the other moved jobs. With the Linux jobs now at ~2.4m this
    # is the longest thing on a PR run, so it is the one place left where more
    # cores shorten the critical path rather than a job nothing waits on.
    permissions:
      contents: read
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Docker info
        run: docker compose version
      - name: Log in to GHCR
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Service-backed checks
        # MUX_CI_PULL_IMAGE makes integration-up.sh pull the published dev image
        # rather than rebuild it. The Dockerfile now installs cargo-insta and
        # cargo-llvm-cov, which compile from source and added roughly 90s to
        # every run of this job once the image gained them.
        env:
          MUX_CI_PULL_IMAGE: "1"
        run: ./scripts/integration-checks.sh
  valgrind:
    name: Valgrind Memory Checks
    needs: detect-changes
    if: ${{ needs.detect-changes.outputs.rust == 'true' || github.event_name == 'push' }}
    runs-on: blacksmith-2vcpu-ubuntu-2404
    # No credentials: the package is public, so an anonymous pull works. That
    # matters for fork PRs - their GITHUB_TOKEN is scoped to the fork and cannot
    # authenticate to this org's registry, so supplying credentials would fail
    # exactly where an anonymous pull succeeds.
    container: ghcr.io/muxlang/mux-ci:main
    permissions:
      contents: read
    # Longest of the Linux jobs, so it sets the wall clock for this group. The
    # bound matters more now the runner is metered - and compiled Mux programs
    # hang rather than crash under LLVM UB, which is exactly what this job runs
    # hundreds of.
    timeout-minutes: 30
    # PR-blocking: Leg A (compiled programs) fails the job on any definite or
    # indirect leak / memory error. Leg B (compiler under Valgrind) is
    # report-only inside the script and never changes the exit code.
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      # Programs link the runtime cargo builds into target/ from the commit
      # Cargo.lock pins - the same library a release ships.
      #
      # Toolchain, LLVM 22 and valgrind itself all come from the CI image now.
      - name: Cache Cargo registry and build artifacts
        # Was actions/cache over ~/.cargo/{registry,git,bin} only. Despite the
        # step name, target/ was never cached, so every job below did a cold
        # full compile of the LLVM/inkwell dependency tree on every run.
        #
        # Adding target/ to the old config would not have worked: all four jobs
        # shared one key, so whichever finished first saved its target/ and the
        # other three restored artifacts built under a different profile
        # (clippy runs --all-targets --all-features, coverage runs
        # instrumented). rust-cache keys per job automatically - job id plus
        # rustc version plus Cargo.lock - which is what makes a shared cache
        # correct here rather than merely large.
        #
        # save-if restricts writes to main: four jobs each saving a multi-GB
        # target/ on every PR run would churn through the 10GB repo cache limit
        # and evict the entries this exists to provide. PRs restore from main's
        # cache, which is the state they branch from anyway.
        uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        with:
          save-if: ${{ github.ref == 'refs/heads/main' }}
      - name: Valgrind checks
        id: run
        run: |
          set -o pipefail
          ./scripts/valgrind-checks.sh 2>&1 | tee valgrind.log
      - name: Upload valgrind log for PR comment
        # Raw log only; the trusted pr-comment workflow escapes and renders it.
        if: ${{ always() && github.event_name == 'pull_request' }}
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: pr-comment-valgrind
          path: valgrind.log
          if-no-files-found: warn
  rc_leak_check:
    name: RC Leak Check
    needs: detect-changes
    if: ${{ needs.detect-changes.outputs.rust == 'true' || github.event_name == 'push' }}
    runs-on: blacksmith-2vcpu-ubuntu-2404
    # No credentials: the package is public, so an anonymous pull works. That
    # matters for fork PRs - their GITHUB_TOKEN is scoped to the fork and cannot
    # authenticate to this org's registry, so supplying credentials would fail
    # exactly where an anonymous pull succeeds.
    container: ghcr.io/muxlang/mux-ci:main
    timeout-minutes: 25
    permissions:
      contents: read
    # PR-blocking: runs the executable-integration suite against a mux-runtime
    # built with the `rc-leak-check` feature, which asserts at process exit that
    # every reference-counted Value block was released (see mux-runtime
    # src/refcount.rs). This is exact, unlike the Valgrind leg: it catches
    # "still reachable" leaks - a module global or enum payload left at refcount
    # 1 (mux-compiler#284) - that Valgrind's definite/indirect policy ignores. A
    # leaking program exits 101 with a diagnostic, so its snapshot no longer
    # matches and the suite fails.
    env:
      # MUX_RUNTIME_SRC and MUX_RUNTIME_LIB are NOT set here. A job-level
      # env: value is a literal - GitHub does not shell-expand it - so
      # "$GITHUB_WORKSPACE/mux-runtime" would stay literal, and
      # ${{ github.workspace }} resolves to the runner's path rather than
      # the /__w/... mount the container sees. Both are wrong. They are
      # exported from a step below instead, where the shell expands them.
      # Built explicitly below and forced via MUX_RUNTIME_LIB, mirroring
      # scripts/leak-check.sh. `rc-leak-check` is deliberately outside `full`,
      # so it is the one runtime the compiler cannot produce on its own.
      MUX_RUNTIME_LEAK_FEATURES: core,json,csv,net,sql,sync,rc-leak-check
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Resolve the mux-runtime ref to test
        id: runtime_ref
        env:
          # Labels are read through env because a label is attacker-controlled
          # on a fork PR and expressions inside run blocks are substituted
          # before the shell sees them.
          PR_LABELS: ${{ toJSON(github.event.pull_request.labels.*.name) }}
        run: |
          set -euo pipefail
          ref=main
          paired=$(python3 -c 'import json, os; labels = json.loads(os.environ.get("PR_LABELS", "[]")); match = next((label for label in labels if label.startswith("paired-runtime:")), ""); print(match.removeprefix("paired-runtime:"), end="")')
          if [ -n "$paired" ]; then
            case "$paired" in
              -* | *..* | *[!A-Za-z0-9._/-]*)
                echo "::error::paired-runtime label is not a valid branch name: $paired"
                exit 1
                ;;
            esac
            ref="$paired"
          fi
          echo "ref=$ref" >> "$GITHUB_OUTPUT"
          echo "Testing muxlang/mux-runtime@$ref against this compiler."
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: muxlang/mux-runtime
          ref: ${{ steps.runtime_ref.outputs.ref }}
          path: mux-runtime
      # Toolchain and LLVM 22 both come from the CI image.
      - name: Cache Cargo registry and build artifacts
        # Was actions/cache over ~/.cargo/{registry,git,bin} only. Despite the
        # step name, target/ was never cached, so every job below did a cold
        # full compile of the LLVM/inkwell dependency tree on every run.
        #
        # Adding target/ to the old config would not have worked: all four jobs
        # shared one key, so whichever finished first saved its target/ and the
        # other three restored artifacts built under a different profile
        # (clippy runs --all-targets --all-features, coverage runs
        # instrumented). rust-cache keys per job automatically - job id plus
        # rustc version plus Cargo.lock - which is what makes a shared cache
        # correct here rather than merely large.
        #
        # save-if restricts writes to main: four jobs each saving a multi-GB
        # target/ on every PR run would churn through the 10GB repo cache limit
        # and evict the entries this exists to provide. PRs restore from main's
        # cache, which is the state they branch from anyway.
        uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        with:
          save-if: ${{ github.ref == 'refs/heads/main' }}
      - name: Resolve runtime paths for the container
        # Written through $GITHUB_ENV so the shell expands
        # $GITHUB_WORKSPACE to the path this container actually sees.
        run: |
          set -euo pipefail
          echo "MUX_RUNTIME_SRC=$GITHUB_WORKSPACE/mux-runtime" >> "$GITHUB_ENV"
          echo "MUX_RUNTIME_LIB=$GITHUB_WORKSPACE/mux-runtime/target/debug/libmux_runtime.a" >> "$GITHUB_ENV"
      - name: Build the rc-leak-check runtime
        run: |
          set -euo pipefail
          cd "$MUX_RUNTIME_SRC"
          # --locked: this is a clean checkout of mux-runtime with its committed
          # lock, so resolving fresh here would build something the repo never
          # pinned (flagged by sonar githubactions:S8549).
          cargo build --locked --no-default-features \
            --features "$MUX_RUNTIME_LEAK_FEATURES" \
            --target-dir "$MUX_RUNTIME_SRC/target"
          test -f "$MUX_RUNTIME_SRC/target/debug/libmux_runtime.a"

      - name: Executable suite under leak-check runtime
        # MUX_RUNTIME_LIB forces the archive built above, so every program links
        # the leak-check runtime and runs the exit-time assertion. A leaked block
        # exits 101 with a diagnostic, so its snapshot no longer matches and the
        # suite fails.
        run: cargo test -p mux-lang --test executable_integration
      - name: Generated program campaign under leak-check runtime
        # One full scheduled feature cycle from scripts/generate-programs.py.
        # The campaign is deterministic, so a failing seed can be rerun locally
        # with the same --seed and the preserved source/output artifacts.
        run: |
          set -euo pipefail
          scripts/run-generated-programs.py \
            --mux target/debug/mux \
            --runtime-lib "$MUX_RUNTIME_LIB" \
            --count 12 \
            --start-seed 1 \
            --keep-failures generated-program-failures
      - name: Upload generated program failures
        if: failure()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: generated-program-failures
          path: generated-program-failures
          if-no-files-found: ignore
  sonarqube:
    name: SonarQube
    # Runs on every push and pull request (no path gating): SonarQube analyzes
    # the whole project, so it must not be skipped just because no Rust files
    # changed. `needs` + `always()` lets it still run when rust_checks is
    # path-skipped; the coverage download is best-effort in that case.
    needs: rust_checks
    if: ${{ always() }}
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - name: Download coverage report
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        continue-on-error: true
        with:
          name: coverage-lcov
      - name: SonarQube Scan
        uses: SonarSource/sonarqube-scan-action@22918119ff8e1ca75a623e15c8296b6ea4fbe28f # v8.2.1
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
      # The scan above waits for analysis (sonar.qualitygate.wait), so the
      # new-issue count is queryable by the time this runs.
      - name: Fail on new SonarCloud issues
        if: github.event_name == 'pull_request'
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
        run: ./scripts/ci/sonar-new-issues.sh muxlang_mux-compiler "${{ github.event.pull_request.number }}"
