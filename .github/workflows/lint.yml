name: Lint

on:
  push:
    branches:
      - main
  pull_request:
    types: [opened, synchronize, reopened]

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.run_id }}
  cancel-in-progress: true

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

defaults:
  run:
    shell: bash

jobs:
  lint_workflows:
    # Keep workflow and generated-program lint independent from the compiler
    # build matrix. It must run for workflow-only changes, which the compiler
    # path filter intentionally skips.
    name: Lint Workflows
    runs-on: ubuntu-latest
    permissions:
      contents: read
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: actionlint + shellcheck
        run: ./scripts/ci/lint-workflows.sh
      - name: Install Ruff
        uses: astral-sh/ruff-action@278981a28ce3188b1e39527901f38254bf3aac89 # v4.1.0
        with:
          version: "0.16.4"
          args: "--version"
      - name: Ruff
        run: |
          ruff format --check scripts/generate-programs.py scripts/run-generated-programs.py scripts/tests
          ruff check scripts/generate-programs.py scripts/run-generated-programs.py scripts/tests
      - name: Generated program tooling tests
        run: python3 -m unittest discover -s scripts/tests -p 'test_*.py' -v
