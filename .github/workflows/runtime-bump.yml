name: Runtime Bump

# `mux-runtime` is a git dependency on its `main` branch, and Cargo.lock pins one
# exact commit. That pin is what makes `--locked` builds reproducible, but it also
# means main stops tracking the runtime the moment the runtime merges something.
# This job advances the pin, so "main is the most recent changes" stays true
# without giving up the lock.
#
# It runs the test suite against the new runtime before opening the PR. That is
# deliberate: a pull request created with GITHUB_TOKEN does not trigger other
# workflows, so the PR would otherwise arrive with no CI at all. Testing here
# means a runtime change that breaks the compiler shows up as a draft PR naming
# the commit that did it, instead of as a surprise on someone else's branch.
# Point this at a PAT if you would rather have the PR run the full CI matrix.

on:
  schedule:
    - cron: "0 6 * * *"
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: write

jobs:
  bump:
    name: Advance the locked mux-runtime commit
    runs-on: ubuntu-latest
    env:
      LLVM_SYS_221_PREFIX: /usr/lib/llvm-22
      LLVM_CONFIG_PATH: /usr/bin/llvm-config-22
      LLVM_SYS_221_STRICT_VERSIONING: "1"
      CC: clang-22
      CXX: clang++-22
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@efa25f7f19611383d5b0ccf2d1c8914531636bf9
        with:
          toolchain: 1.93.1

      - name: Install LLVM 22
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends ca-certificates gnupg lsb-release wget
          sudo wget --max-redirect=0 -O /usr/share/keyrings/llvm-snapshot.gpg.key https://apt.llvm.org/llvm-snapshot.gpg.key
          echo "deb [signed-by=/usr/share/keyrings/llvm-snapshot.gpg.key] https://apt.llvm.org/$(lsb_release -cs)/ llvm-toolchain-$(lsb_release -cs)-22 main" | sudo tee /etc/apt/sources.list.d/llvm.list
          sudo apt-get update
          sudo apt-get install -y llvm-22-dev clang-22 lld-22 libpolly-22-dev

      - name: Advance the locked commit
        id: bump
        run: |
          set -euo pipefail
          locked_commit() {
            awk '/^name = "mux-runtime"$/ { found = 1 }
                 found && /^source = / { print; exit }' Cargo.lock \
              | sed 's/.*#//; s/"$//'
          }
          before="$(locked_commit)"
          cargo update -p mux-runtime
          after="$(locked_commit)"

          if [ "$before" = "$after" ]; then
            echo "Runtime pin is already current ($before)."
            echo "changed=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          echo "changed=true" >> "$GITHUB_OUTPUT"
          echo "before=$before" >> "$GITHUB_OUTPUT"
          echo "after=$after" >> "$GITHUB_OUTPUT"
          echo "short=${after:0:7}" >> "$GITHUB_OUTPUT"

      - name: Test against the new runtime
        id: verify
        if: steps.bump.outputs.changed == 'true'
        continue-on-error: true
        run: cargo test --locked

      - name: Open pull request
        if: steps.bump.outputs.changed == 'true'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          BEFORE: ${{ steps.bump.outputs.before }}
          AFTER: ${{ steps.bump.outputs.after }}
          SHORT: ${{ steps.bump.outputs.short }}
          VERIFY: ${{ steps.verify.outcome }}
        run: |
          set -euo pipefail
          branch="bot/runtime-${SHORT}"

          if git ls-remote --exit-code --heads origin "$branch" >/dev/null 2>&1; then
            echo "Branch $branch already exists; nothing to do."
            exit 0
          fi

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git switch -c "$branch"
          git add Cargo.lock
          git commit -m "Advance the locked mux-runtime commit to ${SHORT}"
          git push -u origin "$branch"

          if [ "$VERIFY" = "success" ]; then
            title="Advance mux-runtime to ${SHORT}"
            draft=""
            verdict="\`cargo test --locked\` passed against the new runtime."
          else
            title="Advance mux-runtime to ${SHORT} (tests failing)"
            draft="--draft"
            verdict="\`cargo test --locked\` FAILED against the new runtime. The runtime changed in a way the compiler does not handle - see the workflow run for the failure."
          fi

          # shellcheck disable=SC2086
          gh pr create $draft \
            --title "$title" \
            --body "$(printf '%s\n\n%s\n\n%s\n' \
              "Moves the locked \`mux-runtime\` commit from \`${BEFORE}\` to \`${AFTER}\`." \
              "$verdict" \
              "Opened automatically so \`main\` keeps tracking runtime \`main\` without loosening the lock. See .github/workflows/runtime-bump.yml.")"
