name: Benchmarks
# The full criterion suite: 5 phases (lex, parse, semantics, codegen, pipeline)
# against every .mux in test_scripts/, so roughly 565 benchmarks per run and
# ~34 minutes of wall clock.
#
# It used to run on every push and pull request while gating nothing
# (continue-on-error), which made it 62% of the compiler's CI time for a report
# nobody read. It now runs where the cost buys something:
#
#   - on demand, when someone is actually investigating performance;
#   - on release tags, which gives a per-version series that is more useful than
#     daily points and is anchored to something people can correlate with.
#
# Deliberately NOT nightly: a nightly nobody reads is the same noise with a
# schedule attached.
#
# Stays on GitHub-hosted runners. Nobody waits on this, so it is exactly the
# workload that should never consume metered minutes.
on:
  workflow_dispatch:
  push:
    tags:
      - "v*"

concurrency:
  # Keyed on ref so a tag run and a manual run never cancel each other. Never
  # cancel in progress: a partial benchmark run is worse than a slow one.
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  benchmarks:
    name: Full benchmark suite
    runs-on: ubuntu-latest
    # ~34 minutes typical. The cap is a runaway guard, not a target - well under
    # GitHub's 6-hour default so a hung criterion run fails in reasonable time.
    timeout-minutes: 90
    env:
      LLVM_SYS_221_PREFIX: /usr/lib/llvm-22
      LLVM_CONFIG_PATH: /usr/bin/llvm-config-22
      LLVM_SYS_221_STRICT_VERSIONING: "1"
      CC: clang-22
      CXX: clang++-22
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@efa25f7f19611383d5b0ccf2d1c8914531636bf9 # untagged master commit; the repo's only tag (v1) is OLDER than this
        with:
          toolchain: 1.93.1
          components: llvm-tools-preview
      - name: Install LLVM 22
        run: ./scripts/ci/install-llvm.sh
      - name: Cache Cargo registry and build
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            ~/.cargo/bin
          key: ${{ runner.os }}-cargo-${{ hashFiles('**/Cargo.lock', '**/Cargo.toml') }}
          restore-keys: |
            ${{ runner.os }}-cargo-
      # The execution benchmarks compile+link+run real programs, so they need the
      # runtime staticlib. cargo emits a dependency's rlib and never its
      # staticlib, so it is built explicitly.
      - name: Build the runtime staticlib
        run: cargo build -p mux-runtime --locked
      - name: Run benchmarks
        run: |
          set -o pipefail
          cargo bench -p mux-lang 2>&1 | tee bench.log
      - name: Build per-phase distribution report
        run: python3 scripts/bench-report.py --summary-json bench-summary.json
      - name: Derive a filesystem-safe artifact suffix
        id: label
        # upload-artifact rejects names containing path separators and several
        # other characters. Branch names here are slash-delimited (ci/...,
        # docs/...), so a manual dispatch would otherwise run the whole suite and
        # only then fail on the upload.
        run: printf 'suffix=%s\n' "${GITHUB_REF_NAME//[^A-Za-z0-9._-]/-}" >> "$GITHUB_OUTPUT"
      - name: Upload benchmark report
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: benchmark-report-${{ steps.label.outputs.suffix }}
          path: |
            target/bench-report/
            target/criterion/
            bench.log
            bench-summary.json
          if-no-files-found: warn
