name: Release

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  verify-release-commit:
    name: Verify Release Commit
    runs-on: ubuntu-latest
    outputs:
      on_main: ${{ steps.branch_policy.outputs.on_main }}
    # No LLVM env here: setup-llvm exports every one of these, and two sources
    # for the same variable is how they drift apart.
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      - name: Check whether tag commit is on main
        id: branch_policy
        run: |
          git fetch origin main --depth=1
          if git merge-base --is-ancestor "$GITHUB_SHA" origin/main; then
            echo "on_main=true" >> "$GITHUB_OUTPUT"
            echo "Tag commit is on main."
          else
            echo "on_main=false" >> "$GITHUB_OUTPUT"
            echo "Tag commit is not on main. Build checks and artifacts will run, release publish will be skipped."
          fi

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@efa25f7f19611383d5b0ccf2d1c8914531636bf9 # untagged master commit; the repo's only tag (v1) is OLDER than this
        with:
          toolchain: 1.93.1
          components: rustfmt, clippy

      - name: Setup LLVM 22
        uses: ./.github/actions/setup-llvm
        with:
          extra-components: lld

      - name: Formatting check
        run: cargo fmt -- --check

      - name: Clippy
        run: cargo clippy --locked --all-targets --all-features -- -D warnings

      - name: Tests
        run: cargo test --locked

      - name: Build
        run: cargo build --locked

  build-artifacts:
    name: Build ${{ matrix.runner_name }}
    needs: verify-release-commit
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          # The PUBLISHED Linux build is the oldest supported runner, because a
          # binary linked against a newer glibc will not start on an older one.
          # Built on ubuntu-latest, `mux-linux-x86_64.tar.gz` required
          # GLIBC_2.38/2.39 and so refused to run on Debian 12 stable (2.36),
          # Ubuntu 22.04 LTS, RHEL 9 and Amazon Linux 2023 - while this build,
          # which does run there, was produced and then thrown away.
          - os: ubuntu-22.04
            runner_name: linux-ubuntu-22.04-x86_64
            target: linux-x86_64
            archive_ext: tar.gz
            publish: true
          # Kept as a sanity build against a current toolchain, not shipped.
          - os: ubuntu-latest
            runner_name: linux-ubuntu-latest-x86_64
            target: linux-x86_64-ubuntu-latest
            archive_ext: tar.gz
            publish: false
          - os: macos-15-intel
            runner_name: macos-15-intel-x86_64
            target: macos-x86_64
            archive_ext: tar.gz
            publish: true
          - os: macos-14
            runner_name: macos-14-arm64
            target: macos-aarch64
            archive_ext: tar.gz
            publish: true
          - os: windows-latest
            runner_name: windows-latest-x86_64
            target: windows-x86_64
            archive_ext: zip
            publish: true

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@efa25f7f19611383d5b0ccf2d1c8914531636bf9 # untagged master commit; the repo's only tag (v1) is OLDER than this
        with:
          toolchain: 1.93.1

      - name: Install Rust Windows MSVC target
        if: runner.os == 'Windows'
        run: rustup target add x86_64-pc-windows-msvc

      - name: Setup LLVM 22
        # One shared definition of "give me a working LLVM" for all three
        # platforms, including the ~230 lines of Windows conda/MSVC/libxml2 work
        # this file used to carry inline.
        #
        # build.yml's packaged-artifact matrix exercises these paths on
        # ubuntu-latest, macos-14 and windows-latest. It does NOT cover the other
        # two entries here, ubuntu-22.04 and macos-15-intel - which are the ones
        # producing the published linux-x86_64 and macos-x86_64 artifacts. The
        # underlying commands are identical for those (the two Linux installs
        # were byte-identical and the codename is derived; macOS is the same brew
        # formula), but nothing runs them until a tag does.
        uses: ./.github/actions/setup-llvm
        with:
          extra-components: lld

      - name: Build runtime (Windows MSVC)
        if: runner.os == 'Windows'
        run: cargo build -p mux-runtime --release --locked --target x86_64-pc-windows-msvc

      - name: Build compiler (Windows MSVC)
        if: runner.os == 'Windows'
        run: cargo build -p mux-lang --release --locked --target x86_64-pc-windows-msvc

      - name: Build runtime (Non-Windows)
        if: runner.os != 'Windows'
        run: cargo build -p mux-runtime --release --locked

      - name: Build compiler (Non-Windows)
        if: runner.os != 'Windows'
        run: cargo build -p mux-lang --release --locked

      - name: Package artifact (Unix)
        if: runner.os != 'Windows' && matrix.publish
        run: |
          set -euo pipefail
          mkdir -p dist/mux-${{ matrix.target }}/bin
          mkdir -p dist/mux-${{ matrix.target }}/lib
          cp target/release/mux dist/mux-${{ matrix.target }}/bin/
          for lib in target/release/libmux_runtime.a target/release/libmux_runtime.so target/release/libmux_runtime.dylib; do
            if [ -f "$lib" ]; then
              cp "$lib" dist/mux-${{ matrix.target }}/lib/
            fi
          done
          tar -C dist -czf dist/mux-${{ matrix.target }}.${{ matrix.archive_ext }} mux-${{ matrix.target }}
          # Write the checksum with a bare filename (run from dist/) so
          # `sha256sum -c` works from the artifact directory.
          ( cd dist && shasum -a 256 "mux-${{ matrix.target }}.${{ matrix.archive_ext }}" > "mux-${{ matrix.target }}.${{ matrix.archive_ext }}.sha256" )

      - name: Package artifact (Windows)
        if: runner.os == 'Windows' && matrix.publish
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path "dist/mux-${{ matrix.target }}/bin" | Out-Null
          New-Item -ItemType Directory -Force -Path "dist/mux-${{ matrix.target }}/lib" | Out-Null
          Copy-Item "target/x86_64-pc-windows-msvc/release/mux.exe" "dist/mux-${{ matrix.target }}/bin/"

          foreach ($lib in @("target/x86_64-pc-windows-msvc/release/mux_runtime.dll", "target/x86_64-pc-windows-msvc/release/mux_runtime.lib")) {
            if (Test-Path $lib) {
              Copy-Item $lib "dist/mux-${{ matrix.target }}/lib/"
              if ($lib.EndsWith('.dll')) {
                Copy-Item $lib "dist/mux-${{ matrix.target }}/bin/"
              }
            }
          }

          $condaBase = & conda info --base
          $envRoot = Join-Path $condaBase "envs\mux-llvm"
          $llvmBin = Join-Path $envRoot "Library\bin"

          foreach ($pattern in @("LLVM*.dll", "libclang*.dll", "clang*.dll")) {
            Get-ChildItem -Path $llvmBin -Filter $pattern -File -ErrorAction SilentlyContinue | ForEach-Object {
              Copy-Item $_.FullName "dist/mux-${{ matrix.target }}/bin/"
            }
          }

          foreach ($dll in @("libxml2.dll", "zlib.dll", "zstd.dll")) {
            $candidate = Join-Path $llvmBin $dll
            if (Test-Path $candidate) {
              Copy-Item $candidate "dist/mux-${{ matrix.target }}/bin/"
            }
          }

          & "dist/mux-${{ matrix.target }}/bin/mux.exe" version
          # No trailing /* : that packs bin/ and lib/ at the archive root and
          # drops the mux-<target>/ parent, which the tarball keeps and which
          # install.ps1 looks for. Windows installs failed on this from the
          # start - install.ps1 threw "Could not find mux.exe in archive" for
          # every release.
          Compress-Archive -Path "dist/mux-${{ matrix.target }}" -DestinationPath "dist/mux-${{ matrix.target }}.${{ matrix.archive_ext }}" -Force
          $hash = (Get-FileHash -Algorithm SHA256 "dist/mux-${{ matrix.target }}.${{ matrix.archive_ext }}").Hash.ToLower()
          "$hash  mux-${{ matrix.target }}.${{ matrix.archive_ext }}" | Out-File -FilePath "dist/mux-${{ matrix.target }}.${{ matrix.archive_ext }}.sha256" -Encoding ascii

      - name: Upload build artifacts
        if: matrix.publish
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: mux-${{ matrix.target }}
          path: |
            dist/mux-${{ matrix.target }}.${{ matrix.archive_ext }}
            dist/mux-${{ matrix.target }}.${{ matrix.archive_ext }}.sha256

  verify-install:
    # Install the artifact that is about to be published, exactly the way a user
    # would, and compile and run programs with it.
    #
    # This is the gate that makes "publish a compiler that cannot compile hello
    # world" impossible - the failure that shipped in v0.6.0. It is also the only
    # thing that ever EXECUTES scripts/install.sh and install.ps1; build.yml only
    # parses them. Writing it immediately found that install.ps1 had never worked
    # on any release: the zip packed bin/ at its root while the script looked for
    # mux-<target>/bin/mux.exe, and it installed only mux.exe without the LLVM
    # DLLs beside it. Both are fixed in this change.
    #
    # The installers take MUX_RELEASE_BASE_URL, so they run unmodified against
    # the artifacts from this run rather than a published release that does not
    # exist yet.
    #
    # NOTE on gating: `needs` is not the same as a required status check. A
    # skipped or failed job here genuinely skips publish-release, so this does
    # NOT need the aggregator pattern build.yml uses for its matrix - that exists
    # because required checks treat a skipped job as green, which `needs` does
    # not.
    name: Verify Install (${{ matrix.label }})
    needs: build-artifacts
    runs-on: ${{ matrix.os }}
    container: ${{ matrix.container }}
    timeout-minutes: 30
    permissions:
      contents: read
    strategy:
      # One platform failing must not hide the others.
      fail-fast: false
      matrix:
        include:
          # An old-glibc container is the only place a too-new glibc requirement
          # can be caught: the build runner is always newer than the oldest
          # system we support, so the binary always runs where it was built.
          - label: debian-12
            os: ubuntu-latest
            container: debian:12
            artifact: mux-linux-x86_64
          - label: ubuntu-22.04
            os: ubuntu-latest
            container: ubuntu:22.04
            artifact: mux-linux-x86_64
          # Native, because a container cannot stand in for either.
          - label: macos-aarch64
            os: macos-14
            artifact: mux-macos-aarch64
          - label: macos-x86_64
            os: macos-15-intel
            artifact: mux-macos-x86_64
          - label: windows-x86_64
            os: windows-latest
            artifact: mux-windows-x86_64
          # rockylinux:9 is deliberately absent. It carries glibc 2.34 against
          # the 2.35 the published runtime is built on, so libmux_runtime.so
          # references hypot@GLIBC_2.35 and every compiled program there fails to
          # load it. That is a real portability gap rather than a CI problem, and
          # adding the leg now would block releases on it. Tracked separately;
          # this is the leg to restore first once it is fixed, because it is the
          # only one that would catch a glibc regression.
    steps:
      - name: Install container prerequisites
        if: ${{ matrix.container != '' }}
        shell: sh
        run: |
          set -eu
          # A C toolchain is required: mux links compiled programs with cc.
          # Deliberately gcc rather than clang - it also proves the "any C
          # driver of any version" claim from #318. curl, tar, gzip and
          # ca-certificates are already present in these images.
          apt-get update
          apt-get install -y --no-install-recommends \
            ca-certificates curl gcc libc6-dev tar gzip git python3

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Download the artifact built by this run
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          # This leg's platform only. Downloading the whole set would pull ~200MB
          # to serve one file.
          name: ${{ matrix.artifact }}
          path: artifacts

      - name: Serve the artifacts over loopback
        shell: bash
        run: |
          set -euo pipefail
          ls -l artifacts
          # Output is redirected to a file rather than inherited. A backgrounded
          # process holding the step's stdout keeps the runner's stream readers
          # open, which makes it kill the whole process tree ~5s after the step
          # ends - on Windows that reaches this server, and the install step
          # would then get connection-refused. Redirecting sidesteps that path
          # entirely and drops the 5s stall with it.
          python3 -m http.server 8000 --directory artifacts --bind 127.0.0.1 \
            > "${RUNNER_TEMP}/artifact-server.log" 2>&1 &
          for _ in $(seq 1 30); do
            if curl -fsS "http://127.0.0.1:8000/" >/dev/null 2>&1; then
              echo "artifact server up"
              exit 0
            fi
            sleep 1
          done
          echo "artifact server did not come up:" >&2
          cat "${RUNNER_TEMP}/artifact-server.log" >&2
          exit 1

      - name: Install with scripts/install.sh
        if: ${{ runner.os != 'Windows' }}
        shell: bash
        env:
          MUX_RELEASE_BASE_URL: http://127.0.0.1:8000
          MUX_INSTALL_DIR: ${{ github.workspace }}/installed/bin
          MUX_LIB_DIR: ${{ github.workspace }}/installed/lib
        run: sh scripts/install.sh

      - name: Install with scripts/install.ps1
        if: ${{ runner.os == 'Windows' }}
        shell: pwsh
        env:
          MUX_RELEASE_BASE_URL: http://127.0.0.1:8000
          MUX_INSTALL_DIR: ${{ github.workspace }}\installed\bin
          MUX_LIB_DIR: ${{ github.workspace }}\installed\lib
        run: ./scripts/install.ps1

      - name: Compile and run programs with the installed compiler
        shell: bash
        run: |
          set -euo pipefail
          exe=""
          if [ "${RUNNER_OS}" = "Windows" ]; then exe=".exe"; fi
          ./scripts/ci/smoke-run.sh "installed/bin/mux${exe}"

      - name: Show what was installed
        # Only on failure, and it is the first question anyone asks: a missing
        # runtime library or a DLL left behind in the bundle looks identical to a
        # compiler bug from the error alone.
        if: ${{ failure() }}
        shell: bash
        run: |
          echo "--- installed/bin ---"; ls -l installed/bin || true
          echo "--- installed/lib ---"; ls -l installed/lib || true
          echo "--- artifact server log ---"; cat "${RUNNER_TEMP}/artifact-server.log" || true

  publish-release:
    name: Publish Release
    needs:
      - verify-release-commit
      - build-artifacts
      - verify-install
    if: ${{ needs.verify-release-commit.outputs.on_main == 'true' }}
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Download artifacts
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          path: dist

      - name: Extract changelog for release
        id: changelog
        run: |
          TAG="${GITHUB_REF_NAME}"
          VERSION="${TAG#v}"
          echo "Extracting changelog for version $VERSION"
          version_prefix="## [$VERSION]"
          awk -v version="$version_prefix" '
            index($0, version) == 1 {
              found=1
              print
              next
            }
            found && /^## \[/ {
              exit
            }
            found {
              print
            }
          ' CHANGELOG.md > changelog_section.md
          # If no specific section found, use "Unreleased" section
          if [ ! -s changelog_section.md ]; then
            echo "No section for version $VERSION, using Unreleased section"
            awk '
              index($0, "## [Unreleased]") == 1 {
                found=1
                print
                next
              }
              found && /^## \[/ {
                exit
              }
              found {
                print
              }
            ' CHANGELOG.md > changelog_section.md
          fi
          # If still empty, create a placeholder
          if [ ! -s changelog_section.md ]; then
            echo "No changelog section found." > changelog_section.md
          fi
          # Output multiline variable
          echo "body<<EOF" >> $GITHUB_OUTPUT
          cat changelog_section.md >> $GITHUB_OUTPUT
          echo "EOF" >> $GITHUB_OUTPUT

      - name: Publish to GitHub Releases
        uses: softprops/action-gh-release@3d0d9888cb7fd7b750713d6e236d1fcb99157228 # v3.0.2
        with:
          body: ${{ steps.changelog.outputs.body }}
          files: |
            dist/**/*.tar.gz
            dist/**/*.zip
            dist/**/*.sha256
