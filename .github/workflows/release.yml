name: Release

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  verify-release-commit:
    name: Verify Release Commit
    runs-on: ubuntu-latest
    outputs:
      on_main: ${{ steps.branch_policy.outputs.on_main }}
    # No LLVM env here: setup-llvm exports every one of these, and two sources
    # for the same variable is how they drift apart.
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          fetch-depth: 0

      - name: Check whether tag commit is on main
        id: branch_policy
        run: |
          git fetch origin main --depth=1
          if git merge-base --is-ancestor "$GITHUB_SHA" origin/main; then
            echo "on_main=true" >> "$GITHUB_OUTPUT"
            echo "Tag commit is on main."
          else
            echo "on_main=false" >> "$GITHUB_OUTPUT"
            echo "Tag commit is not on main. Build checks and artifacts will run, release publish will be skipped."
          fi

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@efa25f7f19611383d5b0ccf2d1c8914531636bf9
        with:
          toolchain: 1.93.1
          components: rustfmt, clippy

      - name: Setup LLVM 22
        uses: ./.github/actions/setup-llvm
        with:
          extra-components: lld

      - name: Formatting check
        run: cargo fmt -- --check

      - name: Clippy
        run: cargo clippy --locked --all-targets --all-features -- -D warnings

      - name: Tests
        run: cargo test --locked

      - name: Build
        run: cargo build --locked

  build-artifacts:
    name: Build ${{ matrix.runner_name }}
    needs: verify-release-commit
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          # The PUBLISHED Linux build is the oldest supported runner, because a
          # binary linked against a newer glibc will not start on an older one.
          # Built on ubuntu-latest, `mux-linux-x86_64.tar.gz` required
          # GLIBC_2.38/2.39 and so refused to run on Debian 12 stable (2.36),
          # Ubuntu 22.04 LTS, RHEL 9 and Amazon Linux 2023 - while this build,
          # which does run there, was produced and then thrown away.
          - os: ubuntu-22.04
            runner_name: linux-ubuntu-22.04-x86_64
            target: linux-x86_64
            archive_ext: tar.gz
            publish: true
          # Kept as a sanity build against a current toolchain, not shipped.
          - os: ubuntu-latest
            runner_name: linux-ubuntu-latest-x86_64
            target: linux-x86_64-ubuntu-latest
            archive_ext: tar.gz
            publish: false
          - os: macos-15-intel
            runner_name: macos-15-intel-x86_64
            target: macos-x86_64
            archive_ext: tar.gz
            publish: true
          - os: macos-14
            runner_name: macos-14-arm64
            target: macos-aarch64
            archive_ext: tar.gz
            publish: true
          - os: windows-latest
            runner_name: windows-latest-x86_64
            target: windows-x86_64
            archive_ext: zip
            publish: true

    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@efa25f7f19611383d5b0ccf2d1c8914531636bf9
        with:
          toolchain: 1.93.1

      - name: Install Rust Windows MSVC target
        if: runner.os == 'Windows'
        run: rustup target add x86_64-pc-windows-msvc

      - name: Setup LLVM 22
        # One shared definition of "give me a working LLVM" for all three
        # platforms, including the ~230 lines of Windows conda/MSVC/libxml2 work
        # this file used to carry inline.
        #
        # build.yml's packaged-artifact matrix exercises these paths on
        # ubuntu-latest, macos-14 and windows-latest. It does NOT cover the other
        # two entries here, ubuntu-22.04 and macos-15-intel - which are the ones
        # producing the published linux-x86_64 and macos-x86_64 artifacts. The
        # underlying commands are identical for those (the two Linux installs
        # were byte-identical and the codename is derived; macOS is the same brew
        # formula), but nothing runs them until a tag does.
        uses: ./.github/actions/setup-llvm
        with:
          extra-components: lld

      - name: Build runtime (Windows MSVC)
        if: runner.os == 'Windows'
        run: cargo build -p mux-runtime --release --locked --target x86_64-pc-windows-msvc

      - name: Build compiler (Windows MSVC)
        if: runner.os == 'Windows'
        run: cargo build -p mux-lang --release --locked --target x86_64-pc-windows-msvc

      - name: Build runtime (Non-Windows)
        if: runner.os != 'Windows'
        run: cargo build -p mux-runtime --release --locked

      - name: Build compiler (Non-Windows)
        if: runner.os != 'Windows'
        run: cargo build -p mux-lang --release --locked

      - name: Package artifact (Unix)
        if: runner.os != 'Windows' && matrix.publish
        run: |
          set -euo pipefail
          mkdir -p dist/mux-${{ matrix.target }}/bin
          mkdir -p dist/mux-${{ matrix.target }}/lib
          cp target/release/mux dist/mux-${{ matrix.target }}/bin/
          for lib in target/release/libmux_runtime.a target/release/libmux_runtime.so target/release/libmux_runtime.dylib; do
            if [ -f "$lib" ]; then
              cp "$lib" dist/mux-${{ matrix.target }}/lib/
            fi
          done
          tar -C dist -czf dist/mux-${{ matrix.target }}.${{ matrix.archive_ext }} mux-${{ matrix.target }}
          # Write the checksum with a bare filename (run from dist/) so
          # `sha256sum -c` works from the artifact directory.
          ( cd dist && shasum -a 256 "mux-${{ matrix.target }}.${{ matrix.archive_ext }}" > "mux-${{ matrix.target }}.${{ matrix.archive_ext }}.sha256" )

      - name: Package artifact (Windows)
        if: runner.os == 'Windows' && matrix.publish
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path "dist/mux-${{ matrix.target }}/bin" | Out-Null
          New-Item -ItemType Directory -Force -Path "dist/mux-${{ matrix.target }}/lib" | Out-Null
          Copy-Item "target/x86_64-pc-windows-msvc/release/mux.exe" "dist/mux-${{ matrix.target }}/bin/"

          foreach ($lib in @("target/x86_64-pc-windows-msvc/release/mux_runtime.dll", "target/x86_64-pc-windows-msvc/release/mux_runtime.lib")) {
            if (Test-Path $lib) {
              Copy-Item $lib "dist/mux-${{ matrix.target }}/lib/"
              if ($lib.EndsWith('.dll')) {
                Copy-Item $lib "dist/mux-${{ matrix.target }}/bin/"
              }
            }
          }

          $condaBase = & conda info --base
          $envRoot = Join-Path $condaBase "envs\mux-llvm"
          $llvmBin = Join-Path $envRoot "Library\bin"

          foreach ($pattern in @("LLVM*.dll", "libclang*.dll", "clang*.dll")) {
            Get-ChildItem -Path $llvmBin -Filter $pattern -File -ErrorAction SilentlyContinue | ForEach-Object {
              Copy-Item $_.FullName "dist/mux-${{ matrix.target }}/bin/"
            }
          }

          foreach ($dll in @("libxml2.dll", "zlib.dll", "zstd.dll")) {
            $candidate = Join-Path $llvmBin $dll
            if (Test-Path $candidate) {
              Copy-Item $candidate "dist/mux-${{ matrix.target }}/bin/"
            }
          }

          & "dist/mux-${{ matrix.target }}/bin/mux.exe" version
          Compress-Archive -Path "dist/mux-${{ matrix.target }}/*" -DestinationPath "dist/mux-${{ matrix.target }}.${{ matrix.archive_ext }}" -Force
          $hash = (Get-FileHash -Algorithm SHA256 "dist/mux-${{ matrix.target }}.${{ matrix.archive_ext }}").Hash.ToLower()
          "$hash  mux-${{ matrix.target }}.${{ matrix.archive_ext }}" | Out-File -FilePath "dist/mux-${{ matrix.target }}.${{ matrix.archive_ext }}.sha256" -Encoding ascii

      - name: Upload build artifacts
        if: matrix.publish
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: mux-${{ matrix.target }}
          path: |
            dist/mux-${{ matrix.target }}.${{ matrix.archive_ext }}
            dist/mux-${{ matrix.target }}.${{ matrix.archive_ext }}.sha256

  publish-release:
    name: Publish Release
    needs:
      - verify-release-commit
      - build-artifacts
    if: ${{ needs.verify-release-commit.outputs.on_main == 'true' }}
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout repository
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683

      - name: Download artifacts
        uses: actions/download-artifact@95815c38cf2ff2164869cbab79da8d1f422bc89e
        with:
          path: dist

      - name: Extract changelog for release
        id: changelog
        run: |
          TAG="${GITHUB_REF_NAME}"
          VERSION="${TAG#v}"
          echo "Extracting changelog for version $VERSION"
          version_prefix="## [$VERSION]"
          awk -v version="$version_prefix" '
            index($0, version) == 1 {
              found=1
              print
              next
            }
            found && /^## \[/ {
              exit
            }
            found {
              print
            }
          ' CHANGELOG.md > changelog_section.md
          # If no specific section found, use "Unreleased" section
          if [ ! -s changelog_section.md ]; then
            echo "No section for version $VERSION, using Unreleased section"
            awk '
              index($0, "## [Unreleased]") == 1 {
                found=1
                print
                next
              }
              found && /^## \[/ {
                exit
              }
              found {
                print
              }
            ' CHANGELOG.md > changelog_section.md
          fi
          # If still empty, create a placeholder
          if [ ! -s changelog_section.md ]; then
            echo "No changelog section found." > changelog_section.md
          fi
          # Output multiline variable
          echo "body<<EOF" >> $GITHUB_OUTPUT
          cat changelog_section.md >> $GITHUB_OUTPUT
          echo "EOF" >> $GITHUB_OUTPUT

      - name: Publish to GitHub Releases
        uses: softprops/action-gh-release@153bb8e04406b158c6c84fc1615b65b24149a1fe
        with:
          body: ${{ steps.changelog.outputs.body }}
          files: |
            dist/**/*.tar.gz
            dist/**/*.zip
            dist/**/*.sha256
