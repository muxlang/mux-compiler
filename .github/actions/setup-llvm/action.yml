name: Setup LLVM 22
description: >-
  Install LLVM 22 for the current runner OS and export the toolchain variables
  the compiler build needs (LLVM_SYS_221_PREFIX, LLVM_CONFIG_PATH, CC, CXX).

# One place for a job to say "give me a working LLVM", instead of every job
# knowing how each platform provides one. Linux is apt.llvm.org, macOS is
# Homebrew, and Windows is a conda environment plus MSVC plus a hand-built
# libxml2 import library - the Windows path alone is ~230 lines of PowerShell,
# which is exactly why it should exist once.
#
# The Windows scripts here were extracted verbatim from release.yml, which now
# uses this action rather than keeping a second copy. That matters: the Windows
# linking bugs fixed in #328-#333 were all in code nobody had ever run, so two
# copies of the setup would drift in exactly the place drift is most expensive.
#
# Every branch must export the same variable set. release.yml used to supply
# LLVM_SYS_221_STRICT_VERSIONING from job-level env for all platforms at once;
# now that this action is the only source, a branch that omits one silently
# weakens the build that uses it.

inputs:
  extra-components:
    description: >-
      Extra LLVM components to install, unversioned and space separated
      (for example "lld"). Linux only - the macOS and Windows package sets are
      fixed by their upstream formulas.
    required: false
    default: ""

runs:
  using: composite
  steps:
    - name: Install LLVM 22 (Linux)
      if: runner.os == 'Linux'
      shell: bash
      run: |
        set -euo pipefail
        ./scripts/ci/install-llvm.sh ${{ inputs.extra-components }}
        # Derived, not hardcoded: the same expression is then correct on every
        # Ubuntu release, which matters because release.yml builds on both
        # ubuntu-latest and ubuntu-22.04.
        {
          echo "LLVM_SYS_221_PREFIX=$(llvm-config-22 --prefix)"
          echo "LLVM_CONFIG_PATH=$(command -v llvm-config-22)"
          echo "LLVM_SYS_221_STRICT_VERSIONING=1"
          echo "CC=clang-22"
          echo "CXX=clang++-22"
        } >> "$GITHUB_ENV"

    - name: Install LLVM 22 (macOS)
      if: runner.os == 'macOS'
      shell: bash
      run: |
        set -euo pipefail
        brew install llvm@22
        LLVM_PREFIX="$(brew --prefix llvm@22)"
        {
          echo "LLVM_SYS_221_PREFIX=${LLVM_PREFIX}"
          echo "LLVM_CONFIG_PATH=${LLVM_PREFIX}/bin/llvm-config"
          echo "LLVM_SYS_221_STRICT_VERSIONING=1"
          echo "CC=${LLVM_PREFIX}/bin/clang"
          echo "CXX=${LLVM_PREFIX}/bin/clang++"
        } >> "$GITHUB_ENV"

    - name: Setup Miniconda (Windows)
      if: runner.os == 'Windows'
      uses: conda-incubator/setup-miniconda@fc2d68f6413eb2d87b895e92f8584b5b94a10167 # v3.3.0
      with:
        auto-update-conda: true
        use-mamba: true
        channels: conda-forge
        channel-priority: strict

    - name: Install LLVM 22 with conda (Windows)
      if: runner.os == 'Windows'
      shell: pwsh
      run: ${{ github.action_path }}/windows-llvm.ps1

    - name: Setup MSVC developer command prompt (Windows)
      if: runner.os == 'Windows'
      uses: ilammy/msvc-dev-cmd@0b201ec74fa43914dc39ae48a89fd1d8cb592756 # v1.13.0

    - name: Unshadow the MSVC linker (Windows)
      if: runner.os == 'Windows'
      shell: bash
      run: |
        set -euo pipefail
        # Git for Windows ships a coreutils `link` as /usr/bin/link.exe, and in
        # a bash step that directory sits ahead of the MSVC tools on PATH. rustc
        # then invokes the wrong link.exe and every build fails with
        # "linking with `link.exe` failed: exit code: 1", naming
        # C:\Program Files\Git\usr\bin\link.exe in the note.
        #
        # Renamed rather than deleted so the failure mode is obvious if anything
        # ever depends on it. Runners are ephemeral, so this is scoped to the job.
        if [[ -f /usr/bin/link.exe ]]; then
          mv /usr/bin/link.exe /usr/bin/link-coreutils.exe.disabled
          echo "Renamed Git's coreutils link.exe so the MSVC linker resolves first."
        fi
        command -v link.exe || true

    - name: Create xml2 import lib (Windows)
      if: runner.os == 'Windows'
      shell: pwsh
      run: ${{ github.action_path }}/windows-xml2-importlib.ps1

    - name: Validate LLVM toolchain (Windows)
      if: runner.os == 'Windows'
      shell: pwsh
      run: ${{ github.action_path }}/windows-validate.ps1
