name: Verify installed release
description: Install and exercise one platform artifact before publishing a release
inputs:
  artifact:
    description: Artifact name produced by the release build matrix
    required: true
  container:
    description: Container image for this matrix leg, or empty for native runners
    required: false

runs:
  using: composite
  steps:
    # Install the artifact that is about to be published, exactly the way a user
    # would, and compile and run programs with it. This gate makes "publish a
    # compiler that cannot compile hello world" impossible - the failure that
    # shipped in v0.6.0. It is the only place that executes install.sh and
    # install.ps1; build.yml only parses them.
    - name: Install container prerequisites
      if: ${{ inputs.container != '' }}
      shell: sh
      run: |
        set -eu
        # A C toolchain is required: mux links compiled programs with cc.
        # Deliberately gcc rather than clang - it also proves the "any C
        # driver of any version" claim from #318. curl, tar, gzip and
        # ca-certificates are already present in these images.
        apt-get update
        apt-get install -y --no-install-recommends \
          ca-certificates curl gcc libc6-dev tar gzip git python3

    - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

    - name: Download the artifact built by this run
      uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
      with:
        # This leg's platform only. Downloading the whole set would pull ~200MB
        # to serve one file.
        name: ${{ inputs.artifact }}
        path: artifacts

    - name: Serve the artifacts over loopback
      shell: bash
      run: |
        set -euo pipefail
        ls -l artifacts
        # Output is redirected to a file rather than inherited. A backgrounded
        # process holding the step's stdout keeps the runner's stream readers
        # open, which makes it kill the whole process tree ~5s after the step
        # ends - on Windows that reaches this server, and the install step
        # would then get connection-refused. Redirecting sidesteps that path
        # entirely and drops the 5s stall with it.
        python3 -m http.server 8000 --directory artifacts --bind 127.0.0.1 \
          > "${RUNNER_TEMP}/artifact-server.log" 2>&1 &
        for _ in $(seq 1 30); do
          if curl -fsS "http://127.0.0.1:8000/" >/dev/null 2>&1; then
            echo "artifact server up"
            exit 0
          fi
          sleep 1
        done
        echo "artifact server did not come up:" >&2
        cat "${RUNNER_TEMP}/artifact-server.log" >&2
        exit 1

    - name: Install with scripts/install.sh
      if: ${{ runner.os != 'Windows' }}
      shell: bash
      env:
        MUX_RELEASE_BASE_URL: http://127.0.0.1:8000
        MUX_INSTALL_DIR: ${{ github.workspace }}/installed/bin
        MUX_LIB_DIR: ${{ github.workspace }}/installed/lib
      run: sh scripts/install.sh

    - name: Install with scripts/install.ps1
      if: ${{ runner.os == 'Windows' }}
      shell: pwsh
      env:
        MUX_RELEASE_BASE_URL: http://127.0.0.1:8000
        MUX_INSTALL_DIR: ${{ github.workspace }}\installed\bin
        MUX_LIB_DIR: ${{ github.workspace }}\installed\lib
      run: ./scripts/install.ps1

    - name: Compile and run programs with the installed compiler
      shell: bash
      run: |
        set -euo pipefail
        exe=""
        if [ "${RUNNER_OS}" = "Windows" ]; then exe=".exe"; fi
        ./scripts/ci/smoke-run.sh "installed/bin/mux${exe}"

    # The published examples have to work with the compiler being published.
    # mux-examples' own CI runs this same script against compiler main, which is
    # a weaker claim: the installed artifact is what users actually receive.
    # Linux only: the programs are platform-independent, so other platforms
    # would repeat the installer coverage rather than test the examples.
    - name: Check out mux-examples
      if: ${{ runner.os == 'Linux' }}
      uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      with:
        repository: muxlang/mux-examples
        ref: main
        path: mux-examples

    - name: Run the published examples against the installed compiler
      if: ${{ runner.os == 'Linux' }}
      shell: bash
      working-directory: mux-examples
      env:
        # The absolute path matters: the runner cds into each example's
        # directory before invoking the compiler.
        MUX_BIN: ${{ github.workspace }}/installed/bin/mux
        MUX_RUNTIME_LIB: ${{ github.workspace }}/installed/lib/libmux_runtime.a
      run: ./scripts/run-examples.sh

    - name: Show what was installed
      if: ${{ failure() }}
      shell: bash
      run: |
        echo "--- installed/bin ---"; ls -l installed/bin || true
        echo "--- installed/lib ---"; ls -l installed/lib || true
        echo "--- artifact server log ---"; cat "${RUNNER_TEMP}/artifact-server.log" || true
