[package]
name = "mux-lang"
version = "0.9.0"
edition = "2024"
default-run = "mux"
description = "The Mux Programming Language Compiler"
authors = ["Derek Corniello"]
repository = "https://github.com/muxlang/mux-compiler"
license = "MIT"
keywords = ["mux", "compiler", "language"]
categories = ["development-tools", "compilers"]
exclude = ["tests/"]

[[bin]]
name = "mux"
path = "src/main.rs"

[dependencies]
anstream = "1"
anstyle = "1"
ordered-float = "4.2"
unicode-width = "0.1.11"
lazy_static = "1.4"
inkwell = { version = "0.9.0", features = ["llvm22-1"] }
clap = { version = "4", features = ["derive"] }
# Resolved from muxlang/mux-runtime `main`, not crates.io: the compiler and the
# runtime are ABI-coupled and change together, so a coupled change must build
# against the source that defines the new FFI symbols rather than waiting on a
# publish. Cargo.lock pins the exact commit, so `--locked` builds - CI and
# release tags included - are reproducible. Move the pin with
# `cargo update -p mux-runtime`.
mux-runtime = { git = "https://github.com/muxlang/mux-runtime", branch = "main" }
phf = { version = "0.11", features = ["macros"] }

[dev-dependencies]
insta = { version = "1.43.1", features = ["yaml"] }
ordered-float = "4.2"
regex = "1"
toml = "0.8"
criterion = { version = "0.5", features = ["html_reports"] }

[build-dependencies]
set-git-hooks-dir = "1.0"

# Local/manual + non-blocking-CI benchmarks (see CONTRIBUTING.md). Not a merge gate.
[[bench]]
name = "compile"
harness = false

[[bench]]
name = "execution"
harness = false
