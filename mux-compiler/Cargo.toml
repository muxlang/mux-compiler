[package]
name = "mux-lang"
version = "0.10.2"
edition = "2024"
rust-version = "1.93.1"
default-run = "mux"
description = "The Mux Programming Language Compiler"
authors = ["Derek Corniello"]
repository = "https://github.com/muxlang/mux-compiler"
license = "MIT"
keywords = ["mux", "compiler", "language"]
categories = ["development-tools", "compilers"]
exclude = ["tests/"]

[lints.rust]
unused_must_use = "deny"

[lints.clippy]
correctness = "deny"
suspicious = "deny"
unnested_or_patterns = "deny"

[[bin]]
name = "mux"
path = "src/main.rs"

[dependencies]
anstream = "1"
anstyle = "1"
ordered-float = "4.2"
unicode-width = "0.1.11"
fs2 = "0.4"
lazy_static = "1.4"
inkwell = { version = "0.9.0", features = ["llvm22-1"] }
clap = { version = "4", features = ["derive"] }
# Resolved from muxlang/mux-runtime `main`, not crates.io: the compiler and the
# runtime are ABI-coupled and change together, so a coupled change must build
# against the source that defines the new FFI symbols rather than waiting on a
# publish. Pin the exact reviewed runtime stack commit so `--locked` builds -
# CI and release tags included - are reproducible. Move the pin only when the
# runtime stack has merged and passed its gates.
mux-runtime = { version = "0.6.1", git = "https://github.com/muxlang/mux-runtime", rev = "326543d20370148fe77670687b36e20d41833e65" }
phf = { version = "0.11", features = ["macros"] }

[dev-dependencies]
insta = { version = "1.43.1", features = ["yaml"] }
ordered-float = "4.2"
regex = "1"
toml = "0.8"
criterion = { version = "0.5", features = ["html_reports"] }

[build-dependencies]
set-git-hooks-dir = "1.0"

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.59", features = ["Win32_Storage_FileSystem"] }

# Local/manual + non-blocking-CI benchmarks (see CONTRIBUTING.md). Not a merge gate.
[[bench]]
name = "compile"
harness = false

[[bench]]
name = "execution"
harness = false
