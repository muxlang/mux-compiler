[package]
name = "mux-update"
version = "0.1.0"
edition = "2024"
rust-version = "1.93.1"
publish = false
license = "MIT"

[dependencies]
ctrlc = { version = "3", features = ["termination"] }
flate2 = "1"
fs2 = "0.4"
semver = "1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
tar = "0.4"
tempfile = "3"
ureq = "3.4"
zip = { version = "9.0.5", default-features = false, features = ["deflate-flate2"] }
