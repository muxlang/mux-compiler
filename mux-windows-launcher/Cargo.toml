[package]
name = "mux-windows-launcher"
version = "0.1.0"
edition = "2024"
rust-version = "1.93.1"
publish = false
license = "MIT"

[dependencies]
clap = { version = "4", features = ["derive"] }
mux-update = { version = "0.1.0", path = "../mux-update" }

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.59", features = ["Win32_System_Console"] }
