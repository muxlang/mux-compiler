sonar.projectKey=muxlang_mux-compiler
sonar.organization=muxlang
sonar.c.file.suffixes=-
sonar.cpp.file.suffixes=-
sonar.objc.file.suffixes=-
# Scope analysis to the compiler. infra/docker/integration holds throwaway
# echo-server fixtures for integration tests, analyzed where they land rather than
# as part of the compiler gate.
sonar.exclusions=infra/docker/integration/**
# scripts/ holds dev/release tooling (install.sh, timing helpers), not shipped
# compiler code. Keep it analyzed for issues but out of the coverage metric.
sonar.coverage.exclusions=scripts/**
sonar.rust.lcov.reportPaths=lcov.info
# Block on the quality gate: the scanner waits for server-side analysis and
# exits non-zero if the gate fails, so a failing gate fails CI (and local
# runs) instead of silently uploading. The gate's conditions are configured
# in SonarCloud (Quality Gates), not here.
sonar.qualitygate.wait=true
